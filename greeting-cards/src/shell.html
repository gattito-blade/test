<div class="app" id="app">
  <header class="brand" aria-label="Keepsake">
    <svg class="brand-mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <rect class="bm-tile" x="0" y="0" width="16" height="16" rx="4.5"/>
      <path class="bm-back" d="M4.2 4.6 L8 3.6 L8 12.4 L4.2 11.4 Z"/>
      <path class="bm-front" d="M8 3.6 L11.8 4.6 L11.8 11.4 L8 12.4 Z"/>
      <path class="bm-heart" d="M9.9 7.1c.35-.45 1.1-.3 1.1.3 0 .55-.7 1-1.1 1.3-.4-.3-1.1-.75-1.1-1.3 0-.6.75-.75 1.1-.3z"/>
    </svg>
    <div class="brand-text">
      <span class="brand-name">Keepsake</span>
      <span class="brand-sub">a little card studio</span>
    </div>
  </header>

  <main class="stage" id="stage" aria-label="Greeting card viewer"></main>

  <div class="popover" id="writer" role="dialog" aria-modal="false" aria-labelledby="writer-title" hidden>
    <div class="pop-head">
      <h2 class="pop-title" id="writer-title">Write in this card</h2>
      <button type="button" class="pop-x" id="writer-close" title="Close (Esc)" aria-label="Close writing panel">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg>
      </button>
    </div>
    <label class="field">
      <span class="field-label">Message</span>
      <textarea id="f-message" rows="3" spellcheck="true"></textarea>
    </label>
    <div class="field-row">
      <label class="field grow">
        <span class="field-label">Sign-off</span>
        <input id="f-signoff" type="text" maxlength="80" placeholder="— with love, Sam" autocomplete="off">
      </label>
      <div class="field">
        <span class="field-label" id="foil-label">Foil</span>
        <div class="swatches" role="radiogroup" aria-labelledby="foil-label" id="f-foil">
          <button type="button" class="swatch" role="radio" data-foil="gold" title="Gold foil" aria-label="Gold foil"><i class="sw sw-gold"></i></button>
          <button type="button" class="swatch" role="radio" data-foil="silver" title="Silver foil" aria-label="Silver foil"><i class="sw sw-silver"></i></button>
          <button type="button" class="swatch" role="radio" data-foil="rose" title="Rose foil" aria-label="Rose foil"><i class="sw sw-rose"></i></button>
          <button type="button" class="swatch" role="radio" data-foil="holo" title="Holographic foil" aria-label="Holographic foil"><i class="sw sw-holo"></i></button>
        </div>
      </div>
    </div>
    <label class="field" id="f-cover-wrap" hidden>
      <span class="field-label">Cover text</span>
      <textarea id="f-cover" rows="2" spellcheck="false"></textarea>
    </label>
    <div class="pop-actions" id="pop-actions">
      <button type="button" class="pbtn" id="f-copy" title="Copy the message to the clipboard" aria-label="Copy message">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="4.5" y="4.5" width="7" height="7.5" rx="1.5"/><path d="M9.5 2.5h-6a1 1 0 0 0-1 1v6"/></svg>
        <span>Copy message</span>
      </button>
      <button type="button" class="pbtn pbtn-quiet" id="f-reset" title="Reset this card's text and foil" aria-label="Reset this card">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.8 6.8a4.4 4.4 0 1 0 1.4-3.2"/><path d="M2.6 1.8v2.6h2.6"/></svg>
        <span>Reset this card</span>
      </button>
    </div>
    <div class="pop-confirm" id="pop-confirm" hidden>
      <span class="confirm-text">Reset message, sign-off, cover text and foil?</span>
      <div class="confirm-btns">
        <button type="button" class="pbtn pbtn-quiet" id="f-reset-no" title="Keep my edits" aria-label="Cancel reset">Cancel</button>
        <button type="button" class="pbtn pbtn-danger" id="f-reset-yes" title="Reset to the original card" aria-label="Confirm reset">Reset</button>
      </div>
    </div>
    <p class="pop-status" id="pop-status" aria-live="polite"></p>
  </div>

  <nav class="toolbar" id="toolbar" aria-label="Card controls">
    <div class="thumbs" id="thumbs" role="group" aria-label="Choose a card"></div>
    <span class="tb-sep" aria-hidden="true"></span>
    <button type="button" class="tb-btn" id="btn-open" title="Open card (Space)" aria-label="Open card" aria-pressed="false">
      <svg class="ic" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <rect x="2.5" y="3.5" width="13" height="11" rx="2"/>
        <path d="M7.5 3.5v11"/>
      </svg>
    </button>
    <button type="button" class="tb-btn" id="btn-write" title="Write a message (W)" aria-label="Write a message" aria-pressed="false" aria-expanded="false" aria-controls="writer">
      <svg class="ic" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <path d="M11.6 3.6l2.8 2.8-7.9 7.9-3.4.6.6-3.4z"/>
        <path d="M10.2 5l2.8 2.8"/>
      </svg>
    </button>
    <button type="button" class="tb-btn" id="btn-play" title="Pause slideshow (P)" aria-label="Pause slideshow" aria-pressed="true">
      <svg class="ic ic-pause" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <rect class="fill" x="5.6" y="5" width="2.2" height="8" rx="0.8"/>
        <rect class="fill" x="10.2" y="5" width="2.2" height="8" rx="0.8"/>
      </svg>
      <svg class="ic ic-play" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <path class="fill" d="M6.4 4.6c0-.6.6-.9 1.1-.6l6 3.9c.5.3.5 1 0 1.3l-6 3.9c-.5.3-1.1 0-1.1-.6z"/>
      </svg>
    </button>
  </nav>

  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
</div>
