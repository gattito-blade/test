<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Keepsake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Instrument+Sans:wght@400..600&family=Josefin+Sans:wght@300..600&display=swap">
<style>
/* Keepsake shell — page, card stage, toolbar, writing panel. All colours are tokens. */
:root {
  color-scheme: light;
  --bg: #FCFCFB;
  --text: #1C1A18;
  --muted: #6F6A63;
  --toolbar: #FFFFFF;
  --hairline: rgba(28, 24, 20, 0.08);
  --hairline-strong: rgba(28, 24, 20, 0.16);
  --tb-shadow-1: rgba(28, 24, 20, 0.05);
  --tb-shadow-2: rgba(28, 24, 20, 0.08);
  --hover: rgba(28, 24, 20, 0.055);
  --active-fill: #151413;
  --on-active: #FFFFFF;
  --underline: #1C1A18;
  --underline-track: rgba(28, 24, 20, 0.13);
  --focus: #2F6FEB;
  --field-bg: #FBFAF7;
  --field-border: rgba(28, 24, 20, 0.14);
  --danger: #B42318;
  --on-danger: #FFFFFF;
  --shadow-contact: rgba(48, 36, 24, 0.26);
  --shadow-ambient: rgba(48, 36, 24, 0.11);
  --paper-edge: rgba(70, 52, 34, 0.38);
  --spine-shade: rgba(60, 44, 28, 0.11);
  --crease: rgba(60, 44, 28, 0.30);
  --crease-lite: rgba(60, 44, 28, 0.10);
  --face-shade: #000000;
  --brand-tile: #1C1A18;
  --brand-paper: #FFFFFF;
  --brand-paper-2: #E9E4DA;
  --brand-heart: #E0457B;
  --hint-bg: rgba(255, 255, 255, 0.92);
  --hint-text: #5D5850;
  --msg-outline: rgba(43, 39, 34, 0.30);
  --msg-focus-bg: rgba(255, 255, 255, 0.35);
  --placeholder: #ECE8E1;
  --thumb-shadow: rgba(40, 30, 20, 0.28);
  --sw-gold-a: #FBEFC4; --sw-gold-b: #D9B45A; --sw-gold-c: #A97C25;
  --sw-silver-a: #FFFFFF; --sw-silver-b: #C9CFD6; --sw-silver-c: #8B939C;
  --sw-rose-a: #FFF0F2; --sw-rose-b: #EBB3BD; --sw-rose-c: #B96A7C;
  --sw-holo-a: #FFD6E8; --sw-holo-b: #D7F3FF; --sw-holo-c: #E6DBFF; --sw-holo-d: #FFF4C9;
  --ui-font: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand-font: "Caveat", "Segoe Script", "Bradley Hand", cursive;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #151413;
    --text: #EDEAE5;
    --muted: #A09B94;
    --toolbar: #211F1D;
    --hairline: rgba(255, 248, 240, 0.08);
    --hairline-strong: rgba(255, 248, 240, 0.16);
    --tb-shadow-1: rgba(0, 0, 0, 0.30);
    --tb-shadow-2: rgba(0, 0, 0, 0.40);
    --hover: rgba(255, 248, 240, 0.07);
    --active-fill: #F2EFEA;
    --on-active: #151413;
    --underline: #EDEAE5;
    --underline-track: rgba(255, 248, 240, 0.16);
    --focus: #7EA6FF;
    --field-bg: #1A1917;
    --field-border: rgba(255, 248, 240, 0.14);
    --danger: #F0705F;
    --on-danger: #1A0F0D;
    --shadow-contact: rgba(0, 0, 0, 0.62);
    --shadow-ambient: rgba(0, 0, 0, 0.36);
    --paper-edge: rgba(30, 22, 14, 0.55);
    --spine-shade: rgba(40, 28, 16, 0.22);
    --crease: rgba(30, 20, 10, 0.42);
    --crease-lite: rgba(30, 20, 10, 0.14);
    --brand-tile: #EDEAE5;
    --brand-paper: #151413;
    --brand-paper-2: #4A4540;
    --brand-heart: #F06F98;
    --hint-bg: rgba(33, 31, 29, 0.92);
    --hint-text: #CFC9C1;
    --placeholder: #2B2825;
    --thumb-shadow: rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151413;
  --text: #EDEAE5;
  --muted: #A09B94;
  --toolbar: #211F1D;
  --hairline: rgba(255, 248, 240, 0.08);
  --hairline-strong: rgba(255, 248, 240, 0.16);
  --tb-shadow-1: rgba(0, 0, 0, 0.30);
  --tb-shadow-2: rgba(0, 0, 0, 0.40);
  --hover: rgba(255, 248, 240, 0.07);
  --active-fill: #F2EFEA;
  --on-active: #151413;
  --underline: #EDEAE5;
  --underline-track: rgba(255, 248, 240, 0.16);
  --focus: #7EA6FF;
  --field-bg: #1A1917;
  --field-border: rgba(255, 248, 240, 0.14);
  --danger: #F0705F;
  --on-danger: #1A0F0D;
  --shadow-contact: rgba(0, 0, 0, 0.62);
  --shadow-ambient: rgba(0, 0, 0, 0.36);
  --paper-edge: rgba(30, 22, 14, 0.55);
  --spine-shade: rgba(40, 28, 16, 0.22);
  --crease: rgba(30, 20, 10, 0.42);
  --crease-lite: rgba(30, 20, 10, 0.14);
  --brand-tile: #EDEAE5;
  --brand-paper: #151413;
  --brand-paper-2: #4A4540;
  --brand-heart: #F06F98;
  --hint-bg: rgba(33, 31, 29, 0.92);
  --hint-text: #CFC9C1;
  --placeholder: #2B2825;
  --thumb-shadow: rgba(0, 0, 0, 0.5);
}

/* ---------- page ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
html { background: var(--bg); }
body {
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--ui-font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
.app { position: fixed; inset: 0; overflow: hidden; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- brand ---------- */
.brand {
  position: fixed; z-index: 30;
  top: calc(14px + env(safe-area-inset-top, 0px));
  left: calc(16px + env(safe-area-inset-left, 0px));
  display: flex; align-items: flex-start; gap: 7px;
  pointer-events: none; user-select: none;
}
.brand-mark { flex: none; margin-top: 1px; }
.bm-tile { fill: var(--brand-tile); }
.bm-back { fill: var(--brand-paper-2); }
.bm-front { fill: var(--brand-paper); }
.bm-heart { fill: var(--brand-heart); }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-name { margin: 0; font-size: 13px; line-height: inherit; font-weight: 600; letter-spacing: -0.005em; color: var(--text); }
.brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ---------- stage & card ---------- */
.stage {
  position: absolute; inset: 0;
  perspective: 1700px;
  touch-action: pinch-zoom;
  user-select: none; -webkit-user-select: none;
}
.slot {
  position: absolute; left: 0; top: 0; width: 0; height: 0;
  perspective: 1500px; perspective-origin: 0 0;
  will-change: transform, opacity;
}
.slot[hidden] { display: none; }
.slot.is-leaving { pointer-events: none; }
.shadow { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.shadow i {
  position: absolute; left: 0; top: 0; display: block;
  width: calc(var(--w) * var(--u) * 1px);
  height: calc(var(--h) * var(--u) * 1px);
  transform-origin: 0 0; will-change: transform, opacity;
}
/* soft edges come from box-shadow (rasterised once), never from a per-frame filter */
.shadow .sh-amb {
  border-radius: 18%;
  background: var(--shadow-ambient);
  box-shadow: 0 0 14px 3px var(--shadow-ambient);
  opacity: 0.45;
}
.shadow .sh-contact {
  border-radius: 3%;
  background: var(--shadow-contact);
  box-shadow: 0 0 10px 1px var(--shadow-contact);
}
.card {
  position: absolute; left: 0; top: 0;
  width: calc(var(--w) * var(--u) * 1px);
  height: calc(var(--h) * var(--u) * 1px);
  transform-origin: 0 0;
  transform-style: preserve-3d;
  will-change: transform;
}
.page {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  transform: translateZ(0);
}
.page canvas, .face canvas {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;
  pointer-events: none;
}
.face, .face * { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.cover {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  transform-origin: 0 50%;
  transform-style: preserve-3d;
  pointer-events: none;
}
.face {
  position: absolute;
  left: calc(var(--pl) * var(--u) * -1px);
  top: calc(var(--pt) * var(--u) * -1px);
  width: calc(var(--fw) * var(--u) * 1px);
  height: calc(var(--fh) * var(--u) * 1px);
  isolation: isolate;
}
.face.back { transform: rotateY(180deg); }
.sheen { mix-blend-mode: screen; }
.spine-shade {
  position: absolute; left: 0; top: 0; bottom: 0; width: 16%;
  /* the fold: a hairline crease right at the spine, then a soft shade fading into the page */
  background:
    linear-gradient(90deg, var(--crease) 0, var(--crease) 0.6px, var(--crease-lite) 1.6px, transparent 4px),
    linear-gradient(90deg, var(--spine-shade), transparent);
  opacity: 0; pointer-events: none;
}
.lid-shade {
  position: absolute; inset: 0; background: var(--face-shade);
  opacity: 0; pointer-events: none;
}

/* ---------- message (live, editable) ---------- */
.msg {
  position: absolute;
  left: calc(var(--mx) * var(--u) * 1px);
  top: calc(var(--my) * var(--u) * 1px);
  width: calc(var(--mw) * var(--u) * 1px);
  height: calc(var(--mh) * var(--u) * 1px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  font-family: var(--hand-font);
  font-weight: 500;
  font-size: calc(var(--ms) * var(--u) * var(--fit, 1) * 1px);
  line-height: 1.2;
  color: var(--ink);
  /* shown the moment the cover lifts (the swinging cover reveals it), editable once settled */
  opacity: 0;
  pointer-events: none;
  /* never paints outside the insert, whatever is typed; the margin leaves room for the focus ring */
  overflow: hidden;
  overflow: clip;
  overflow-clip-margin: 8px;
}
.slot.is-revealed .msg { opacity: 1; }
.slot.is-settled .msg { pointer-events: auto; }
.msg-text {
  max-width: 100%;
  white-space: pre-wrap; overflow-wrap: anywhere;
  border-radius: 6px;
  padding: 0.08em 0.3em;
  outline: 1px dashed transparent; outline-offset: 2px;
  cursor: text;
  user-select: text; -webkit-user-select: text;
  caret-color: currentColor;
  transition: outline-color 0.15s ease, background-color 0.15s ease;
}
.msg-text:empty::before { content: attr(data-placeholder); opacity: 0.35; }
.slot.is-settled .msg-text:hover { outline-color: var(--msg-outline); }
.msg-text:focus { outline: 1px dashed var(--msg-outline); background: var(--msg-focus-bg); }
.msg-text:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.msg-sign {
  font-size: 0.68em; margin-top: 0.35em; opacity: 0.9; white-space: pre-wrap;
  max-width: 100%; overflow-wrap: anywhere;
}
.msg-sign:empty { display: none; }
.msg-hint {
  /* sits just above the message box (a sibling of .msg, which clips its own contents) */
  position: absolute;
  left: calc((var(--mx) + var(--mw) / 2) * var(--u) * 1px);
  top: calc(var(--my) * var(--u) * 1px);
  transform: translate(-50%, calc(-100% - 4px));
  font-family: var(--ui-font); font-size: 11px; font-weight: 500; line-height: 1;
  white-space: nowrap; letter-spacing: 0.01em;
  padding: 5px 8px; border-radius: 999px;
  background: var(--hint-bg); color: var(--hint-text);
  box-shadow: 0 1px 3px var(--tb-shadow-1);
  opacity: 0; transition: opacity 0.18s ease;
  pointer-events: none;
}
.slot.is-settled .msg:hover + .msg-hint { opacity: 1; }
.msg:focus-within + .msg-hint { opacity: 0 !important; }

/* ---------- toolbar ---------- */
.toolbar {
  position: fixed; z-index: 20; left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 8px;
  background: var(--toolbar);
  border: 1px solid var(--hairline);
  border-radius: 16px;
  box-shadow: 0 1px 2px var(--tb-shadow-1), 0 10px 30px -6px var(--tb-shadow-2);
  max-width: calc(100vw - 16px);
}
.thumbs { display: flex; align-items: center; gap: 8px; }
.thumb {
  --t: 36px;
  position: relative; flex: none;
  width: calc(var(--t) + 8px); height: calc(var(--t) + 8px);
  padding: 0; border: 0; border-radius: 10px; background: transparent;
  display: grid; place-items: center;
  cursor: pointer;
  transition: background-color 0.15s ease;
}
.thumb canvas {
  --rot: 0deg;
  display: block; width: var(--t); height: var(--t);
  /* inactive cards read as washed-out, greyish snapshots, each laid down at a slight tilt */
  opacity: 0.55; filter: grayscale(0.65) drop-shadow(0 0.5px 1px var(--thumb-shadow));
  transform: rotate(var(--rot));
  transition: opacity 0.2s ease, filter 0.2s ease, transform 0.2s cubic-bezier(.2,.8,.3,1);
}
.thumb:nth-child(1) canvas { --rot: -3deg; }
.thumb:nth-child(2) canvas { --rot: 2.5deg; }
.thumb:nth-child(3) canvas { --rot: -2deg; }
.thumb:nth-child(4) canvas { --rot: 3deg; }
.thumb:nth-child(5) canvas { --rot: -2.5deg; }
.thumb:hover canvas { transform: translateY(-2px) rotate(var(--rot)); opacity: 0.85; filter: grayscale(0.25) drop-shadow(0 1px 1.5px var(--thumb-shadow)); }
.thumb[aria-current="true"] canvas { opacity: 1; filter: drop-shadow(0 0.5px 1px var(--thumb-shadow)); }
/* two-segment progress mark under the active card: a faint track; the first segment darkens while the
   card is open, both once it has been opened and closed (data-prog, set by the shell) */
.thumb::before, .thumb::after {
  content: ""; position: absolute; bottom: 0;
  width: 9px; height: 2px; border-radius: 2px;
  background: var(--underline-track);
  opacity: 0;
  transition: opacity 0.2s ease, background-color 0.2s ease;
}
.thumb::before { left: calc(50% - 10px); }
.thumb::after { left: calc(50% + 1px); }
.thumb[aria-current="true"]::before, .thumb[aria-current="true"]::after { opacity: 1; }
.thumb[data-prog="1"]::before, .thumb[data-prog="2"]::before, .thumb[data-prog="2"]::after { background: var(--underline); }
.tb-sep { width: 8px; flex: none; }
.tb-btn {
  flex: none; width: 40px; height: 40px; border-radius: 999px;
  border: 0; padding: 0; background: transparent; color: var(--text);
  display: grid; place-items: center; cursor: pointer;
  transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
}
.tb-btn:hover { background: var(--hover); }
.tb-btn:active { transform: scale(0.94); }
.tb-btn .ic { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tb-btn .ic .fill { fill: currentColor; stroke: none; }
.tb-btn[aria-pressed="true"]#btn-open,
.tb-btn[aria-expanded="true"]#btn-write { background: var(--active-fill); color: var(--on-active); }
#btn-play .ic-play { display: none; }
#btn-play[aria-pressed="false"] .ic-play { display: block; }
#btn-play[aria-pressed="false"] .ic-pause { display: none; }

/* ---------- writing panel ---------- */
.popover {
  position: fixed; z-index: 25; left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: min(420px, calc(100vw - 32px));
  max-height: calc(100vh - 150px);
  max-height: calc(100dvh - 150px);
  overflow: auto;
  transform: translateX(-50%);
  padding: 14px 14px 10px;
  background: var(--toolbar);
  border: 1px solid var(--hairline);
  border-radius: 16px;
  box-shadow: 0 1px 2px var(--tb-shadow-1), 0 18px 44px -10px var(--tb-shadow-2);
  font-size: 13px;
  animation: pop-in 0.18s cubic-bezier(.2,.8,.3,1);
}
.popover[hidden] { display: none; }
@keyframes pop-in { from { opacity: 0; transform: translate(-50%, 6px) scale(0.98); } to { opacity: 1; transform: translate(-50%, 0); } }
.pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.pop-title { font-size: 13px; font-weight: 600; margin: 0; }
.pop-x {
  width: 28px; height: 28px; border-radius: 999px; border: 0; background: transparent;
  display: grid; place-items: center; cursor: pointer; color: var(--muted);
}
.pop-x:hover { background: var(--hover); color: var(--text); }
.pop-x svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.field { display: block; margin: 0 0 10px; }
.field-row { display: flex; gap: 12px; align-items: flex-end; }
.field-row .grow { flex: 1; min-width: 0; }
.field-row .swatches { height: 38px; align-items: center; }
.field[hidden] { display: none; }
.field-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 0 4px; letter-spacing: 0.02em; }
.field textarea, .field input {
  display: block; width: 100%;
  font: inherit; color: var(--text);
  background: var(--field-bg);
  border: 1px solid var(--field-border); border-radius: 10px;
  padding: 8px 10px; resize: vertical;
}
#f-message, #f-signoff { font-family: var(--hand-font); font-size: 19px; line-height: 1.2; font-weight: 500; }
#f-signoff { height: 38px; padding-top: 4px; padding-bottom: 4px; }
#f-cover { font-family: "Josefin Sans", "Futura", "Century Gothic", var(--ui-font); letter-spacing: 0.08em; text-transform: none; }
.field textarea:focus, .field input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.swatches { display: flex; gap: 6px; }
.swatch {
  width: 30px; height: 30px; border-radius: 999px; padding: 3px;
  border: 1px solid var(--field-border); background: transparent; cursor: pointer;
  display: grid; place-items: center;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.swatch:hover { transform: translateY(-1px); }
.swatch[aria-checked="true"] { border: 2px solid var(--text); padding: 2px; }
.sw { display: block; width: 100%; height: 100%; border-radius: 999px; }
.sw-gold { background: linear-gradient(135deg, var(--sw-gold-a), var(--sw-gold-b) 55%, var(--sw-gold-c)); }
.sw-silver { background: linear-gradient(135deg, var(--sw-silver-a), var(--sw-silver-b) 55%, var(--sw-silver-c)); }
.sw-rose { background: linear-gradient(135deg, var(--sw-rose-a), var(--sw-rose-b) 55%, var(--sw-rose-c)); }
.sw-holo { background: linear-gradient(135deg, var(--sw-holo-a), var(--sw-holo-b) 35%, var(--sw-holo-c) 65%, var(--sw-holo-d)); }
.pop-actions, .confirm-btns { display: flex; gap: 6px; flex-wrap: wrap; }
/* Copy / Reset stay reachable when the panel has to scroll */
.pop-actions { position: sticky; bottom: 0; z-index: 1; padding-top: 4px; background: var(--toolbar); }
.pop-actions[hidden], .pop-confirm[hidden] { display: none; }
.pbtn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--field-border); background: var(--toolbar); color: var(--text);
  font-size: 12px; font-weight: 500; cursor: pointer;
}
.pbtn:hover { background: var(--hover); }
.pbtn svg { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.pbtn-quiet { border-color: transparent; color: var(--muted); background: transparent; }
.pbtn-quiet:hover { color: var(--text); }
.pbtn-danger { background: var(--danger); color: var(--on-danger); border-color: transparent; }
.pbtn-danger:hover { background: var(--danger); filter: brightness(1.08); }
.pop-confirm {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px; border-radius: 12px;
  position: sticky; bottom: 0; z-index: 1;
  background-color: var(--toolbar); background-image: linear-gradient(var(--hover), var(--hover));
}
.confirm-text { font-size: 12px; }
/* always rendered (an empty live region must stay in the accessibility tree to be announced) */
.pop-status { min-height: 14px; margin: 6px 2px 0; font-size: 11px; color: var(--muted); }

/* ---------- small screens ---------- */
@media (max-width: 480px) {
  .thumb { --t: 30px; width: calc(var(--t) + 6px); height: calc(var(--t) + 8px); }
  .thumbs { gap: 2px; }
  .toolbar { gap: 2px; padding: 6px; }
  .tb-sep { width: 4px; }
  .tb-btn { width: 36px; height: 36px; }
  .popover { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 350px) {
  .thumb { --t: 26px; width: calc(var(--t) + 4px); }
  .toolbar { gap: 0; padding: 5px; }
  .tb-btn { width: 32px; height: 32px; }
  .tb-sep { width: 2px; }
}
/* short landscape screens: the panel docks at the right and the card moves into the band left of it */
@media (max-height: 520px) and (min-aspect-ratio: 1/1) {
  .popover {
    left: auto; right: calc(16px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));

<script>
/* Keepsake core: card registry, deterministic randomness, face rendering and shared paint helpers.
   Shared by the app shell (src/shell.js) and the preview harness (tools/preview.html). See CONTRACT.md. */
(function () {
  "use strict";
  const K = (window.KEEPSAKE = window.KEEPSAKE || {});
  K.cards = K.cards || {};
  K.ORDER = ["lily-stars", "cherry-blossom", "mothers-day", "bunny-space", "pearl-moon"];

  K.registerCard = function (spec) {
    const need = ["id", "title", "size", "paper", "insert", "ink", "foil", "message", "drawCover", "drawBack", "drawInside"];
    for (const k of need) if (spec[k] == null) throw new Error(`card ${spec.id || "?"} is missing "${k}"`);
    spec.bleed = Object.assign({ t: 0, r: 0, b: 0, l: 0 }, spec.bleed || {});
    K.cards[spec.id] = spec;
  };

  /* ---------- deterministic randomness ---------- */
  K.hash = function (str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };
  K.rng = function (seed) {
    let a = (typeof seed === "string" ? K.hash(seed) : seed) >>> 0;
    const r = function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + (hi - lo) * r();
    r.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * r());
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };

  /* ---------- geometry ---------- */
  // Each face is authored in card units: the card rectangle spans (0,0)-(size.w,size.h).
  // Die-cut art on the front may overflow by `bleed` (fractions of w/h). The back face mirrors that bleed.
  K.faceGeom = function (card, face) {
    const { w, h } = card.size;
    let b = card.bleed;
    if (face === "back") b = { t: b.t, r: b.l, b: b.b, l: b.r };
    if (face === "inside") b = { t: 0, r: 0, b: 0, l: 0 };
    const pad = { t: b.t * h, r: b.r * w, b: b.b * h, l: b.l * w };
    return { w, h, pad, W: w + pad.l + pad.r, H: h + pad.t + pad.b };
  };
  K.insertRect = function (card) {
    const { w, h } = card.size;
    return card.insertRect || { x: w * 0.045, y: h * 0.035, w: w * 0.91, h: h * 0.93 };
  };
  K.messageRect = function (card) {
    const { w, h } = card.size;
    return card.messageRect || { x: w * 0.16, y: h * 0.17, w: w * 0.68, h: h * 0.44 };
  };

  /* ---------- face rendering ---------- */
  // The back of the cover is a silhouette of the front art. The front is almost always painted just before
  // the back (same card, scale and text), so the last front painting is remembered and reused rather than
  // painted a second time. Internal only: callers see the same API and the same pixels.
  let lastFront = null;
  // layer: "art" (full colour) or "foil" (opaque white wherever foil/glitter lives; alpha = mask strength)
  // opts: { text } — the card's (possibly user-edited) coverText
  K.renderFace = function (card, face, layer, scale, opts) {
    opts = opts || {};
    const g = K.faceGeom(card, face);
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(g.W * scale));
    c.height = Math.max(1, Math.round(g.H * scale));
    const ctx = c.getContext("2d");
    const o = {
      text: opts.text != null ? opts.text : card.coverText,
      rand: K.rng(card.id + ":" + face),
      rng: (name) => K.rng(card.id + ":" + face + ":" + name), // independent named streams, identical in both layers
      face, layer, scale,
    };
    const box = { w: g.w, h: g.h };
    ctx.setTransform(scale, 0, 0, scale, g.pad.l * scale, g.pad.t * scale);
    if (face === "front") {
      card.drawCover(ctx, box, layer, o);
      if (layer === "art") lastFront = { card, scale, text: o.text, canvas: c };
    } else if (face === "back") {
      if (layer === "art") {
        // silhouette of the cover, mirrored, in the card stock colour
        const lf = lastFront;
        const front = lf && lf.card === card && lf.scale === scale && lf.text === o.text
          ? lf.canvas
          : K.renderFace(card, "front", "art", scale, opts);
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(front, 0, 0);
        ctx.restore();
        // keep only the solid die-cut shape: soft drop shadows painted on the front have partial alpha
        // and would otherwise turn into a pale haze around the silhouette
        const id = ctx.getImageData(0, 0, c.width, c.height), px = id.data;
        for (let i = 3; i < px.length; i += 4) {
          const a = px[i];
          px[i] = a <= 110 ? 0 : a >= 200 ? 255 : ((a - 110) * 255) / 90;
        }
        ctx.putImageData(id, 0, 0);
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = "source-in";
        ctx.fillStyle = card.backPaper || card.paper;
        ctx.fillRect(0, 0, c.width, c.height);
        // a soft shade toward the spine (right edge of the back face)
        const sh = ctx.createLinearGradient(c.width - g.pad.l * scale - g.w * scale * 0.25, 0, c.width - g.pad.l * scale, 0);
        sh.addColorStop(0, "rgba(0,0,0,0)");
        sh.addColorStop(1, "rgba(60,40,20,0.10)");
        ctx.globalCompositeOperation = "source-atop";
        ctx.fillStyle = sh;
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.restore();
        // die-cut overhangs are the backs of separate layers: a shade darker than the card stock
        ctx.save();
        ctx.globalCompositeOperation = "source-atop";
        ctx.fillStyle = "rgba(70,60,50,0.12)";
        ctx.beginPath();
        ctx.rect(-g.pad.l, -g.pad.t, g.W, g.H);
        ctx.rect(0, 0, g.w, g.h);
        ctx.fill("evenodd");
        ctx.restore();
        K.paperGrain(ctx, -g.pad.l, -g.pad.t, g.W, g.H, K.rng(card.id + ":grain"), 0.05, "source-atop");
      }
      card.drawBack(ctx, box, layer, o);
    } else if (face === "inside") {
      if (layer === "art") {
        ctx.fillStyle = card.paper;
        ctx.fillRect(0, 0, g.w, g.h);
        K.paperGrain(ctx, 0, 0, g.w, g.h, K.rng(card.id + ":grain2"), 0.04);
        const r = K.insertRect(card);
        ctx.save();
        ctx.shadowColor = "rgba(40,30,20,0.18)";
        ctx.shadowBlur = 6 * 1;
        ctx.shadowOffsetX = -1;
        ctx.shadowOffsetY = 1;
        ctx.fillStyle = card.insert;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.restore();
        K.paperGrain(ctx, r.x, r.y, r.w, r.h, K.rng(card.id + ":grain3"), 0.03);
      }
      card.drawInside(ctx, box, layer, o);
    }
    return c;
  };

  K.thumb = function (card, px) {
    const g = K.faceGeom(card, "front");
    const s = px / Math.max(g.W, g.H);
    return K.renderFace(card, "front", "art", s).toDataURL("image/png");
  };

  /* ---------- shared paint helpers (optional for card authors) ---------- */
  // Fine paper grain: tiny light/dark flecks. mode lets you keep it inside existing paint ("source-atop").
  K.paperGrain = function (ctx, x, y, w, h, rand, amount, mode) {
    rand = K.rng((rand() * 4294967296) >>> 0); // consumes exactly ONE value from the caller's stream
    const n = Math.round((w * h) / 9);
    ctx.save();
    if (mode) ctx.globalCompositeOperation = mode;
    for (let i = 0; i < n; i++) {
      const dark = rand() < 0.5;
      ctx.fillStyle = dark ? `rgba(70,50,30,${amount * rand()})` : `rgba(255,255,255,${amount * 1.4 * rand()})`;
      ctx.fillRect(x + rand() * w, y + rand() * h, 0.6 + rand() * 0.8, 0.6 + rand() * 0.8);
    }
    ctx.restore();
  };

  // Star path (points, outer radius r, inner ratio). Rounded=true softens tips like a punched sticker.
  K.starPath = function (ctx, x, y, r, points, inner, rot, rounded) {
    points = points || 5; inner = inner == null ? 0.48 : inner; rot = rot || -Math.PI / 2;
    const pts = [];
    for (let i = 0; i < points * 2; i++) {
      const rr = i % 2 ? r * inner : r, a = rot + (i * Math.PI) / points;
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    ctx.beginPath();
    if (!rounded) { pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); return; }
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const start = mid(pts[pts.length - 1], pts[0]);
    ctx.moveTo(start[0], start[1]);
    for (let i = 0; i < pts.length; i++) { const p = pts[i], m = mid(p, pts[(i + 1) % pts.length]); ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]); }
    ctx.closePath();
  };

  // 4-point sparkle (the "twinkle" glyph)
  K.sparklePath = function (ctx, x, y, r, thin) {
    thin = thin || 0.18;
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.quadraticCurveTo(x + r * thin, y - r * thin, x + r, y);
    ctx.quadraticCurveTo(x + r * thin, y + r * thin, x, y + r);
    ctx.quadraticCurveTo(x - r * thin, y + r * thin, x - r, y);
    ctx.quadraticCurveTo(x - r * thin, y - r * thin, x, y - r);
    ctx.closePath();
  };

  // Glitter: fills the CURRENT path (call after building a path) with dense flecks of the given palette.
  // layer "foil" -> draws the clip area as opaque white so the shell can sheen it.
  K.glitterFill = function (ctx, layer, rand, palette, opts) {
    opts = opts || {};
    rand = K.rng((rand() * 4294967296) >>> 0); // consumes exactly ONE value from the caller's stream in either layer
    ctx.save();
    ctx.clip();
    if (layer === "foil") {
      ctx.fillStyle = `rgba(255,255,255,${opts.mask == null ? 1 : opts.mask})`;
      ctx.fillRect(-1e4, -1e4, 2e4, 2e4);
      ctx.restore();
      return;
    }
    const b = opts.bounds; // {x,y,w,h} in card units — required for speed
    ctx.fillStyle = opts.base || palette[0];
    ctx.fillRect(b.x, b.y, b.w, b.h);
    const n = Math.round(b.w * b.h * (opts.density || 2.2));
    const size = opts.size || 0.9;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = palette[(rand() * palette.length) | 0];
      const s = size * (0.5 + rand());
      ctx.fillRect(b.x + rand() * b.w, b.y + rand() * b.h, s, s);
    }
    // a few bright glints
    const g = Math.round(n * (opts.glints || 0.02));
    for (let i = 0; i < g; i++) {
      ctx.fillStyle = opts.glint || "rgba(255,255,240,0.95)";
      const s = size * (0.6 + rand() * 0.8);
      ctx.fillRect(b.x + rand() * b.w, b.y + rand() * b.h, s, s);
    }
    ctx.restore();
  };

  K.mix = function (a, b, t) {
    const p = (h) => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map((c) => c + c).join(""); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const A = p(a), B = p(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
  };

  /* ---------- placeholders so the shell never breaks if a card file is missing ---------- */
  K.ensureCards = function () {
    const tints = ["#F1E6C8", "#C8102E", "#E9E7E4", "#E0156E", "#F2F2F4"];
    K.ORDER.forEach((id, i) => {
      if (K.cards[id]) return;
      K.registerCard({
        id, title: id, size: { w: 240, h: 300 }, paper: "#F4F1EA", insert: "#FBF8F2", ink: "#2A2723", foil: "gold",
        message: "Placeholder card.\n(" + id + ")",
        drawCover(ctx, b, layer) { if (layer === "art") { ctx.fillStyle = tints[i]; ctx.fillRect(0, 0, b.w, b.h); } },
        drawBack() {}, drawInside() {},
      });
    });
  };
})();

</script>
<script>
/* ---- card: lily-stars ---- */
/* Card 1 — "Starry lilies": cream cardstock, hand-painted gold glitter stripes, punched glitter stars
   with teal borders, and two die-cut stargazer lilies that overflow the card edges. See CONTRACT.md. */
(function () {
  "use strict";
  const K = window.KEEPSAKE;
  const TAU = Math.PI * 2;
  const D2R = Math.PI / 180;

  const CARD = "#F2E8CB";
  const TEAL = "#2F5A4E";

  /* ------------------------------------------------------------------ */
  /* glitter tiles: generated once per (kind, scale), deterministic,     */
  /* used only by the art layer (the foil layer paints flat white)       */
  /* ------------------------------------------------------------------ */
  const TILE = 256; // device px
  const TILE_SPECS = {
    // resting gold sits dark and olive (bronze); the shell's moving light band lifts it to bright yellow
    gold: {
      base: "#937A27",
      blobs: ["rgba(92,68,8,0.45)", "rgba(206,182,96,0.45)", "rgba(146,116,26,0.45)", "rgba(190,162,74,0.45)"],
      flecks: [["#6A5210", 0.14], ["#8E741C", 0.24], ["#AE9235", 0.3], ["#CDB466", 0.2], ["#4C3A08", 0.05], ["#E2D29A", 0.07]],
      density: 0.62, glints: 0.0045, glint: "#FFF6DA",
    },
    teal: {
      base: "#35604F",
      blobs: ["rgba(20,45,38,0.4)", "rgba(110,150,140,0.35)"],
      flecks: [["#2F5A4E", 0.3], ["#3E6C62", 0.3], ["#557F78", 0.18], ["#24483E", 0.12], ["#88AAA2", 0.08]],
      density: 0.45, glints: 0.0012, glint: "#CFE6DD",
    },
  };
  const tiles = {};
  function dropOtherScales(kind, key) {
    for (const k in tiles) if (k !== key && k.startsWith(kind + "@")) delete tiles[k];
  }
  function tile(kind, scale) {
    const key = kind + "@" + scale;
    if (tiles[key]) return tiles[key];
    dropOtherScales(kind, key);
    const sp = TILE_SPECS[kind];
    const c = document.createElement("canvas");
    c.width = c.height = TILE;
    const g = c.getContext("2d");
    const r = K.rng("lily-stars:tile:" + kind);
    g.fillStyle = sp.base;
    g.fillRect(0, 0, TILE, TILE);
    // clumps of lighter / darker glitter (wrapped so the tile repeats without seams)
    const fs = Math.max(1, scale * 0.6); // fleck unit ≈ 0.6 card units
    for (let i = 0; i < 90; i++) {
      const x = r() * TILE, y = r() * TILE, rad = fs * (2 + r() * 7);
      const col = sp.blobs[(r() * sp.blobs.length) | 0];
      for (let dx = -TILE; dx <= TILE; dx += TILE) for (let dy = -TILE; dy <= TILE; dy += TILE) {
        const X = x + dx, Y = y + dy;
        if (X < -rad || Y < -rad || X > TILE + rad || Y > TILE + rad) continue;
        const gr = g.createRadialGradient(X, Y, 0, X, Y, rad);
        gr.addColorStop(0, col);
        gr.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gr;
        g.fillRect(X - rad, Y - rad, rad * 2, rad * 2);
      }
    }
    // flecks, grouped by colour

    g.fillStyle = sp.glint;

      const x = r() * TILE, y = r() * TILE, s = fs * (0.8 + r() * 0.9);

      g.fillRect(x, y, s, s);

        g.globalAlpha = 0.45;
        g.fillRect(x - s, y + s * 0.35, s * 3, s * 0.3);
        g.fillRect(x + s * 0.35, y - s, s * 0.3, s * 3);

  }
  // paper grain and fibres for the cardstock (transparent tile laid over the base colour)
  function paperTile(scale) {
    const key = "paper@" + scale;
    if (tiles[key]) return tiles[key];
    dropOtherScales("paper", key);
    const S = 384, c = document.createElement("canvas");
    c.width = c.height = S;
    const g = c.getContext("2d"), r = K.rng("lily-stars:tile:paper"), u = scale; // u = device px per card unit
    const n = Math.round((S * S) / (9 * u * u));
    for (const [col, share] of [["rgba(70,50,30,0.03)", 0.3], ["rgba(70,50,30,0.06)", 0.2], ["rgba(255,255,255,0.05)", 0.25], ["rgba(255,255,255,0.1)", 0.25]]) {

  function fillGlitter(ctx, o, path, kind, tex, mask) {

  // Draw a soft shadow of `path` only onto pixels that are already painted (source-atop),
  // so shadows never spill into the transparent bleed (keeps the back silhouette clean).
  function atopShadow(ctx, o, path, color, blur, dx, dy) {

    ctx.restore();

  /* ------------------------------------------------------------------ */
  /* shapes                                                              */
  /* ------------------------------------------------------------------ */
  // 5-point star with rounded tips/valleys (punched-sticker look). jit: optional per-vertex radius jitter.
  function starPath(x, y, r, inner, rot, tipR, valR, jit) {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const rr = (i % 2 ? r * inner : r) * (jit ? jit[i] : 1);
      const a = rot + (i * Math.PI) / 5;
      pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
    }
    const p = new Path2D();
    const m0 = [(pts[9][0] + pts[0][0]) / 2, (pts[9][1] + pts[0][1]) / 2];
    p.moveTo(m0[0], m0[1]);
    for (let i = 0; i < 10; i++) {
      const a = pts[i], b = pts[(i + 1) % 10];
      p.arcTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, i % 2 ? valR : tipR);
    }
    p.closePath();
    return p;
  }

  // smooth closed/open path through points (midpoint quadratic)
  function smooth(path, pts, closed, moveFirst) {
    const n = pts.length;
    if (!closed) {
      if (moveFirst !== false) path.moveTo(pts[0][0], pts[0][1]); else path.lineTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < n - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        path.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      }
      path.lineTo(pts[n - 1][0], pts[n - 1][1]);
      return path;
    }
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const s = m(pts[n - 1], pts[0]);
    path.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) {
      const a = pts[i], q = m(a, pts[(i + 1) % n]);
      path.quadraticCurveTo(a[0], a[1], q[0], q[1]);

    path.closePath();
    return path;
  }

  /* ---------- lily tepals ---------- */
  // centreline in the tepal's local frame (x along the tepal, y lateral)
  function cl(T, t) {
    const k = Math.max(0, t - 0.68);
    const x = T.base + (T.len - T.base) * t - T.len * Math.abs(T.curl) * 0.55 * k * k;
    const y = T.len * (T.bow * Math.sin(Math.PI * t) + T.bend * t * t + T.curl * k * k * 1.45);
    return [x, y];
  }
  function profile(t) {
    return (0.3 + 0.7 * Math.sin(Math.PI * Math.pow(t, 0.66))) * Math.pow(Math.max(0, 1 - Math.pow(t, 2.1)), 0.62);
  }
  // world-space frame at t: centre point, unit normal (local +y side), half-widths on each side
  function frame(L, T, t) {
    const d = 0.004;
    const a = cl(T, Math.max(0, t - d)), b = cl(T, Math.min(1, t + d)), c = cl(T, t);
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const l = Math.hypot(tx, ty) || 1;
    tx /= l; ty /= l;
    const ca = Math.cos(T.ang), sa = Math.sin(T.ang);
    const W = (x, y) => [L.cx + x * ca - y * sa, L.cy + x * sa + y * ca];
    const p = W(c[0], c[1]);
    const nx = -ty, ny = tx; // local normal
    const n = [nx * ca - ny * sa, nx * sa + ny * ca];
    const tg = [tx * ca - ty * sa, tx * sa + ty * ca];
    const hw = T.wid * profile(t);
    const wl = 1 + T.wa * Math.sin(TAU * T.wf * t + T.p1) * Math.sin(Math.PI * t) + 0.03 * Math.sin(TAU * 7.3 * t + T.p3);
    const wr = 1 + T.wa * Math.sin(TAU * T.wf * 1.13 * t + T.p2) * Math.sin(Math.PI * t) + 0.03 * Math.sin(TAU * 6.1 * t + T.p3 * 1.7);
    return { p, n, tg, hwL: hw * wl * (1 + T.asym), hwR: hw * wr * (1 - T.asym) };
  }
  function tepalGeom(L, T) {
    const N = 34, left = [], right = [], mid = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, f = frame(L, T, t);
      left.push([f.p[0] + f.n[0] * f.hwL, f.p[1] + f.n[1] * f.hwL]);
      right.push([f.p[0] - f.n[0] * f.hwR, f.p[1] - f.n[1] * f.hwR]);
      mid.push(f.p);
    }
    // outline: left base -> tip -> right base
    const ring = left.concat(right.slice(0, -1).reverse());
    const path = new Path2D();
    path.moveTo(L.cx, L.cy);
    smooth(path, ring, false, false);
    path.closePath();

    const i0 = Math.round(N * 0.16);
    const edge = smooth(new Path2D(), left.slice(i0).concat(right.slice(i0, -1).reverse()), false);
    const spine = smooth(new Path2D(), mid.slice(1, Math.round(N * 0.88)), false);
    const iF = Math.round(N * 0.8);
    return { path, edge, spine, left, right, mid, iF, N };
  }

  /* ------------------------------------------------------------------ */
  /* composition: authored in a 300 x 290 design space; positions (not  */
  /* shapes) are stretched to the card's real size by sx, sy             */
  /* ------------------------------------------------------------------ */
  const DW = 300, DH = 290;
  const STRIPE_X = [23.5, 54.5, 82, 110, 136.5, 164.5, 190, 214.5, 242, 277];
  const STARS = [ // x, y, glitter radius, base rotation (deg)
    [19.5, 78, 10.5, -8],
    [48, 46.5, 12.5, 14],
    [104, 45, 20.5, -20],
    [59, 103, 16.5, 6],
    [172.5, 192, 16.5, -10],
    [208, 245, 20, 4],
    [247.5, 200, 16.5, 18],
    [275, 165, 11.5, -4],
  ];
  // tepal: a = direction (deg), len, wid (max half-width), bow, bend, curl (recurved tip, signed), z (0 back, 1 front)
  const LILIES = [
    {
      name: "lilyA", cx: 239, cy: 53, k: 1.1,
      tepals: [
        { a: -98, len: 98, wid: 35, bow: 0.05, bend: -0.04, curl: -1.4, z: 0 },
        { a: 35, len: 96, wid: 29, bow: -0.05, bend: 0.1, curl: 2.3, z: 0 },
        { a: 172, len: 100, wid: 37, bow: 0.06, bend: -0.12, curl: -0.9, z: 0 },
        { a: -38, len: 84, wid: 25, bow: 0.05, bend: -0.04, curl: 0.9, z: 1 },
        { a: 86, len: 98, wid: 31, bow: -0.13, bend: 0.02, curl: 0.9, z: 1 },
        { a: -157, len: 96, wid: 27, bow: 0.06, bend: -0.06, curl: -2.6, z: 1 },

    },

        { a: -85, len: 92, wid: 31, bow: 0.04, bend: 0.03, curl: 1.8, z: 0 },
        { a: 30, len: 92, wid: 28, bow: 0.04, bend: 0.06, curl: 2.2, z: 0 },
        { a: 153, len: 98, wid: 35, bow: -0.04, bend: -0.05, curl: -0.7, z: 0 },
        { a: -37, len: 102, wid: 33, bow: -0.05, bend: 0.03, curl: 0.6, z: 1 },
        { a: 68, len: 84, wid: 33, bow: 0.06, bend: -0.04, curl: -0.6, z: 1 },
        { a: -159, len: 96, wid: 26, bow: -0.05, bend: 0.04, curl: -2.6, z: 1 },
      ],

  function buildLily(spec, R, sx, sy) {
    const L = { name: spec.name, cx: spec.cx * sx, cy: spec.cy * sy };
    L.tepals = spec.tepals
      .map((t, i) => {
        const T = {
          z: t.z, i,
          ang: t.a * D2R + R.range(-0.025, 0.025),
          len: t.len * spec.k * R.range(0.97, 1.03),
          wid: t.wid * spec.k * R.range(0.95, 1.05),
          base: 3,
          bow: t.bow, bend: t.bend, curl: t.curl,
          wa: R.range(0.07, 0.12), wf: R.range(2.4, 3.6),
          p1: R() * TAU, p2: R() * TAU, p3: R() * TAU, asym: R.range(-0.07, 0.07),

      .sort((a, b) => a.z - b.z || a.i - b.i);

    for (const T of L.tepals) L.sil.addPath(T.g.path);
    L.stamens = spec.stamens.map(([dx, dy]) => ({
      dx: dx * spec.k + R.range(-1.5, 1.5), dy: dy * spec.k + R.range(-1.5, 1.5),
      bend: R.range(4, 8) * (R() < 0.5 ? -1 : 1), rot: R.range(-0.6, 0.6),

    L.pistil = { dx: spec.pistil[0] * spec.k, dy: spec.pistil[1] * spec.k, bend: R.range(-5, 5) };

  /* ------------------------------------------------------------------ */
  /* painters                                                            */
  /* ------------------------------------------------------------------ */
  function paintCardStock(ctx, box, o) {
    const { w, h } = box;
    const T = o.rng("paper-tex");
    ctx.fillStyle = CARD;
    ctx.fillRect(0, 0, w, h);
    // gentle light falloff (lit from top-left)
    const lg = ctx.createLinearGradient(0, 0, w, h);
    lg.addColorStop(0, "rgba(255,252,238,0.35)");
    lg.addColorStop(0.55, "rgba(255,252,238,0)");
    lg.addColorStop(1, "rgba(140,110,60,0.10)");
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 18; i++) {
      const x = T() * w, y = T() * h, r = 15 + T() * 45;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, T() < 0.5 ? "rgba(175,145,90,0.045)" : "rgba(255,255,248,0.07)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    const pt = ctx.createPattern(paperTile(o.scale), "repeat");
    pt.setTransform(new DOMMatrix().translate(T() * 50, T() * 50).scale(1 / o.scale));
    ctx.fillStyle = pt;
    ctx.fillRect(0, 0, w, h);
    // cut edge of the stock
    ctx.strokeStyle = "rgba(150,118,62,0.28)";
    ctx.lineWidth = 0.7;
    ctx.strokeRect(0.35, 0.35, w - 0.7, h - 0.7);
  }

  function stripePaths(box, o) {
    const R = o.rng("stripes");
    const { h } = box, sx = box.w / DW;
    return STRIPE_X.map((x0) => {
      const cx = x0 * sx + R.range(-1, 1), wd = R.range(7.5, 10.5) * sx, lean = R.range(-2.2, 2.2);
      const sw = [R.range(0.5, 1.1), R.range(45, 80), R() * TAU, R.range(0.2, 0.45), R.range(12, 22), R() * TAU];
      const eL = [R.range(0.15, 0.35), R.range(3, 6), R() * TAU, R.range(0.2, 0.4), R.range(8, 14), R() * TAU];
      const eR = [R.range(0.15, 0.35), R.range(3, 6), R() * TAU, R.range(0.2, 0.4), R.range(8, 14), R() * TAU];
      const wv = [R.range(0.04, 0.1), R.range(40, 90), R() * TAU];
      const y0 = R.range(0.8, 2.4), y1 = h - R.range(1.2, 3.2);

      for (let i = 0; i <= steps; i++) {
        const y = y0 + ((y1 - y0) * i) / steps;
        const c = cx + lean * (y / h - 0.5) + f(sw, y);
        const half = (wd * (1 + wv[0] * Math.sin(y / wv[1] + wv[2]))) / 2;
        L.push([c - half + f(eL, y), y]);
        Rt.push([c + half + f(eR, y), y]);

      const p = new Path2D();
      smooth(p, L, false);
      // rounded brush end at the bottom
      const bl = L[L.length - 1], br = Rt[Rt.length - 1];
      p.quadraticCurveTo((bl[0] + br[0]) / 2, bl[1] + 1.4, br[0], br[1]);
      smooth(p, Rt.slice().reverse(), false, false);
      const tl = L[0], tr = Rt[0];
      p.quadraticCurveTo((tl[0] + tr[0]) / 2, tl[1] - 1.2, tl[0], tl[1]);
      p.closePath();
      return { p, cx, y0, y1, wd };
    });
  }

  function paintStripes(ctx, box, o) {
    const S = stripePaths(box, o);
    const art = o.layer === "art";
    const T = art ? o.rng("stripe-tex") : null;
    for (const s of S) {
      fillGlitter(ctx, o, s.p, "gold", T);
      if (!art) continue;
      // uneven paint load along the stripe: lighter and darker patches
      ctx.save();
      ctx.clip(s.p);
      const g = ctx.createLinearGradient(0, s.y0, 0, s.y1);
      for (let k = 0; k <= 8; k++) {
        const v = T();
        g.addColorStop(k / 8, v < 0.45 ? `rgba(70,48,0,${0.05 + T() * 0.2})` : v < 0.8 ? "rgba(0,0,0,0)" : `rgba(255,240,180,${0.08 + T() * 0.16})`);
      }
      ctx.fillStyle = g;
      ctx.fillRect(s.cx - 10, s.y0 - 2, 20, s.y1 - s.y0 + 4);
      // denser glitter at the brush edges
      ctx.strokeStyle = "rgba(110,80,14,0.35)";
      ctx.lineWidth = 0.9;
      ctx.stroke(s.p);
      ctx.restore();
      // a hint of relief: a soft shadow right of each stripe
      ctx.save();
      ctx.strokeStyle = "rgba(120,95,40,0.10)";
      ctx.lineWidth = 0.8;
      ctx.translate(0.5, 0.4);
      ctx.stroke(s.p);
      ctx.restore();
    }
  }

  function paintStars(ctx, box, o) {
    const R = o.rng("stars");
    const art = o.layer === "art";
    const T = art ? o.rng("star-tex") : null;
    const border = 1.7;
    const sx = box.w / DW, sy = box.h / DH, sr = 1 + (Math.min(sx, sy) - 1) * 0.5;

      const x = x0 * sx, y = y0 * sy, r = r0 * sr;

      const all = new Path2D();
      for (const st of stars) all.addPath(outer(st));
