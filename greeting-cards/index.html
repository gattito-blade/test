      ctx.fill(all);
      ctx.restore();
    }
    for (const st of stars) {
      const { x, y, r, p } = st;
      if (art) {
        // teal cardstock border (a slightly larger star behind the glitter one)
        ctx.save();
        ctx.lineWidth = border * 2;
        ctx.lineJoin = "round";
        ctx.strokeStyle = pattern(ctx, o, "teal", T() * 200, T() * 200);
        ctx.stroke(p);
        ctx.restore();
        // glitter
        fillGlitter(ctx, o, p, "gold", T);
        ctx.save();
        ctx.clip(p);
        const lg = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
        lg.addColorStop(0, "rgba(255,244,196,0.22)");
        lg.addColorStop(0.5, "rgba(255,244,196,0)");
        lg.addColorStop(1, "rgba(60,40,0,0.22)");
        ctx.fillStyle = lg;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
        ctx.strokeStyle = "rgba(40,50,30,0.45)";
        ctx.lineWidth = 1.2;
        ctx.stroke(p);
        ctx.restore();
        // light catching the outer rim of the teal border
        ctx.save();
        ctx.translate(-0.35, -0.45);
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = "rgba(190,215,205,0.25)";
        ctx.lineJoin = "round";
        ctx.stroke(outer(st));
        ctx.restore();
      } else {
        // the teal border hides the stripe foil underneath; the glitter shines
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = border * 2;
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#000";
        ctx.stroke(p);
        ctx.fillStyle = "#000";
        ctx.fill(p);
        ctx.restore();
        fillGlitter(ctx, o, p, "gold", null);
      }
    }
  }

  const SPECK = ["#B3305C", "#A1264F", "#C43E6B", "#8E1F45", "#B8385F"];
  function paintTepal(ctx, o, L, T, tex) {
    const g = T.g;
    const art = o.layer === "art";
    if (!art) {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "#000";
      ctx.fill(g.path);
      ctx.restore();
      strokeGlitter(ctx, o, g.edge, "gold", 1.0, null, 0.85);
      return;
    }
    const tip = g.mid[g.N];
    // base colour: pale pink, creamy at the throat, deepening slightly toward the tip
    const lg = ctx.createLinearGradient(L.cx, L.cy, tip[0], tip[1]);
    lg.addColorStop(0, "#F1E3BE");
    lg.addColorStop(0.16, "#FAD0D8");
    lg.addColorStop(0.55, "#F7B6C4");
    lg.addColorStop(1, "#EF93AA");
    ctx.fillStyle = lg;
    ctx.fill(g.path);

    ctx.save();
    ctx.clip(g.path);
    // saturated rose band along the midrib, soft toward the margins
    const band = ctx.createLinearGradient(L.cx, L.cy, tip[0], tip[1]);
    band.addColorStop(0, "rgba(238,111,145,0)");
    band.addColorStop(0.14, "rgba(238,111,145,1)");
    band.addColorStop(0.7, "rgba(238,111,145,0.85)");
    band.addColorStop(1, "rgba(228,96,132,0.6)");
    ctx.strokeStyle = band;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.globalAlpha = 0.2;
    for (let k = 1.7; k > 0.2; k -= 0.25) { ctx.lineWidth = T.wid * k; ctx.stroke(g.spine); }
    ctx.globalAlpha = 1;
    // deeper wash at the tip (watercolour pooling)
    const tw = ctx.createRadialGradient(tip[0], tip[1], 0, tip[0], tip[1], T.len * 0.38);
    tw.addColorStop(0, "rgba(226,84,118,0.55)");
    tw.addColorStop(1, "rgba(226,84,118,0)");
    ctx.fillStyle = tw;
    ctx.fillRect(tip[0] - T.len * 0.4, tip[1] - T.len * 0.4, T.len * 0.8, T.len * 0.8);
    // watercolour blooms: uneven pigment
    for (let k = 0; k < 4; k++) {
      const fr = frame(L, T, 0.2 + tex() * 0.72), sd = (tex() * 2 - 1) * 0.7;
      const bx = fr.p[0] + fr.n[0] * T.wid * sd, by = fr.p[1] + fr.n[1] * T.wid * sd;
      const br = T.len * (0.12 + tex() * 0.2);
      const bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      bg.addColorStop(0, tex() < 0.55 ? `rgba(232,92,126,${0.1 + tex() * 0.14})` : `rgba(255,236,240,${0.14 + tex() * 0.16})`);
      bg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = bg;
      ctx.fillRect(bx - br, by - br, br * 2, br * 2);
    }
    // fine parallel veins
    ctx.lineWidth = 0.45;
    for (const sd of [-0.62, -0.4, -0.2, 0.2, 0.4, 0.62]) {
      const vp = [];
      for (let t = 0.12; t <= 0.86; t += 0.06) {
        const fr = frame(L, T, t), hw = sd > 0 ? fr.hwL : fr.hwR, q = sd * (1 - t * 0.35);
        vp.push([fr.p[0] + fr.n[0] * hw * q, fr.p[1] + fr.n[1] * hw * q]);
      }
      ctx.strokeStyle = `rgba(208,74,112,${0.13 + tex() * 0.1})`;
      ctx.stroke(smooth(new Path2D(), vp, false));
    }
    // recurved tip: underside shows past a fold line
    if (Math.abs(T.curl) > 0.75) {
      const iF = g.iF;
      const flap = new Path2D();
      smooth(flap, g.left.slice(iF).concat(g.right.slice(iF, -1).reverse()), false);
      flap.closePath();
      ctx.fillStyle = "rgba(214,72,118,0.28)";
      ctx.fill(flap);
      const a = g.left[iF], b = g.right[iF], m = g.mid[Math.min(g.N, iF + 2)];
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.quadraticCurveTo(m[0], m[1], b[0], b[1]);
      ctx.strokeStyle = "rgba(186,52,94,0.28)";
      ctx.lineWidth = 0.9;
      ctx.stroke();
    }
    // watercolour edge: pigment pools at the margin
    ctx.strokeStyle = "rgba(214,74,110,0.5)";
    ctx.lineWidth = 3.8;
    ctx.stroke(g.path);
    ctx.strokeStyle = "rgba(196,56,96,0.35)";
    ctx.lineWidth = 1.4;
    ctx.stroke(g.path);
    // highlight crease beside the midrib (the tepal is channelled)
    ctx.save();
    const f = frame(L, T, 0.4);
    ctx.translate(f.n[0] * T.wid * 0.18, f.n[1] * T.wid * 0.18);
    ctx.strokeStyle = "rgba(255,238,244,0.3)";
    ctx.lineWidth = T.wid * 0.3;
    ctx.stroke(g.spine);
    ctx.restore();
    // deeper rose midrib streak
    ctx.strokeStyle = "rgba(214,70,114,0.32)";
    ctx.lineWidth = 2.2;
    ctx.stroke(g.spine);
    ctx.strokeStyle = "rgba(176,44,86,0.3)";
    ctx.lineWidth = 0.6;
    ctx.stroke(g.spine);
    // throat: green-yellow nectary flush at the base
    const th = ctx.createRadialGradient(L.cx, L.cy, 0, L.cx, L.cy, T.len * 0.24);
    th.addColorStop(0, "rgba(170,190,86,0.95)");
    th.addColorStop(0.4, "rgba(206,218,132,0.6)");
    th.addColorStop(1, "rgba(235,235,170,0)");
    ctx.fillStyle = th;
    ctx.beginPath();
    ctx.arc(L.cx, L.cy, T.len * 0.24, 0, TAU);
    ctx.fill();
    const ns = ctx.createLinearGradient(L.cx, L.cy, tip[0], tip[1]);
    ns.addColorStop(0, "rgba(150,175,70,0.5)");
    ns.addColorStop(0.3, "rgba(170,190,90,0)");
    ctx.strokeStyle = ns;
    ctx.lineWidth = 3.4;
    ctx.stroke(g.spine);
    // speckles, concentrated toward the throat
    const n = Math.round(T.len * 0.85);
    const dots = SPECK.flatMap(() => [new Path2D(), new Path2D()]), glints = new Path2D();
    for (let i = 0; i < n; i++) {
      const t = 0.09 + 0.72 * Math.pow(tex(), 1.35);
      const s = (tex() * 2 - 1) * 0.74;
      const fr = frame(L, T, t);
      const hw = s > 0 ? fr.hwL : fr.hwR;
      const x = fr.p[0] + fr.n[0] * hw * s, y = fr.p[1] + fr.n[1] * hw * s;
      const rad = (0.32 + tex() * 0.4) * (1.2 - t * 0.6);
      const b = dots[((tex() * SPECK.length) | 0) * 2 + (tex() < 0.5 ? 0 : 1)];
      b.moveTo(x + rad * 1.35, y);
      b.ellipse(x, y, rad * 1.35, rad, Math.atan2(fr.tg[1], fr.tg[0]), 0, TAU);
      if (tex() < 0.3) glints.rect(x - rad * 0.5, y - rad * 0.6, rad * 0.4, rad * 0.4);
    }
    for (let k = 0; k < dots.length; k++) {
      ctx.fillStyle = SPECK[k >> 1];
      ctx.globalAlpha = k & 1 ? 0.95 : 0.72;
      ctx.fill(dots[k]);
    }
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#FFE6EE";
    ctx.fill(glints);
    ctx.globalAlpha = 1;
    ctx.restore();
    // gilded edge
    strokeGlitter(ctx, o, g.edge, "gold", 1.0, tex);
    ctx.strokeStyle = "rgba(120,60,40,0.25)";
    ctx.lineWidth = 0.35;
    ctx.stroke(g.edge);
  }

  function paintStamens(ctx, o, L, tex) {
    const art = o.layer === "art";
    const items = L.stamens.map((s) => ({ ...s, pistil: false })).concat([{ ...L.pistil, pistil: true, rot: 0 }]);
    const geo = items.map((s) => {
      const ex = L.cx + s.dx, ey = L.cy + s.dy;
      const len = Math.hypot(s.dx, s.dy) || 1;
      const ux = s.dx / len, uy = s.dy / len;
      const sx = L.cx + ux * 2, sy = L.cy + uy * 2;
      const mx = (sx + ex) / 2 - uy * s.bend, my = (sy + ey) / 2 + ux * s.bend;
      const fil = new Path2D();
      fil.moveTo(sx, sy);
      fil.quadraticCurveTo(mx, my, ex, ey);
      const dir = Math.atan2(ey - my, ex - mx);
      return { s, ex, ey, fil, dir };
    });
    if (!art) {
      ctx.save();
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "#000";
      ctx.fillStyle = "#000";
      for (const g of geo) {
        ctx.lineWidth = g.s.pistil ? 2.2 : 1.6;
        ctx.stroke(g.fil);
        ctx.beginPath();
        ctx.ellipse(g.ex, g.ey, 5.8, 2.7, g.dir + g.s.rot, 0, TAU);
        ctx.fill();
      }
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.lineCap = "round";
    // filaments: one soft shadow pass for all, then dark rims and pale cores
    const allFil = new Path2D();
    for (const g of geo) allFil.addPath(g.fil);
    ctx.save();
    ctx.shadowColor = "rgba(120,40,60,0.28)";
    ctx.shadowBlur = 1.5 * o.scale;
    ctx.shadowOffsetX = 0.5 * o.scale;
    ctx.shadowOffsetY = 0.9 * o.scale;
    ctx.strokeStyle = "#86994A";
    ctx.lineWidth = 1.8;
    ctx.stroke(allFil);
    ctx.restore();
    for (const g of geo.slice().reverse()) {
      if (g.s.pistil) {
        ctx.strokeStyle = "#6F8436";
        ctx.lineWidth = 2.4;
        ctx.stroke(g.fil);
      }
      ctx.strokeStyle = g.s.pistil ? "#B6C772" : "#D3DE9C";
      ctx.lineWidth = g.s.pistil ? 1.3 : 0.95;
      ctx.stroke(g.fil);
    }
    // stigma: a slim club that tapers off the style, not a ball
    const pg = geo[geo.length - 1];
    ctx.save();
    ctx.translate(pg.ex, pg.ey);
    ctx.rotate(pg.dir);
    ctx.fillStyle = "#5F6E2C";
    ctx.beginPath();
    ctx.moveTo(-3.2, -0.75);
    ctx.quadraticCurveTo(0.6, -1.25, 1.5, -0.35);
    ctx.quadraticCurveTo(1.85, 0, 1.5, 0.35);
    ctx.quadraticCurveTo(0.6, 1.25, -3.2, 0.75);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(214,226,150,0.6)";
    ctx.fillRect(-1.2, -0.55, 2, 0.35);
    ctx.restore();
    // anthers: one shadow pass, then each anther
    const allAn = new Path2D();
    for (const g of geo) {
      if (g.s.pistil) continue;
      allAn.moveTo(g.ex + Math.cos(g.dir + g.s.rot) * 5.3, g.ey + Math.sin(g.dir + g.s.rot) * 5.3);
      allAn.ellipse(g.ex, g.ey, 5.3, 2.1, g.dir + g.s.rot, 0, TAU);
    }
    ctx.save();
    ctx.shadowColor = "rgba(110,30,40,0.35)";
    ctx.shadowBlur = 1.4 * o.scale;
    ctx.shadowOffsetX = 0.5 * o.scale;
    ctx.shadowOffsetY = 0.9 * o.scale;
    ctx.fillStyle = "#8C3311";
    ctx.fill(allAn);
    ctx.restore();
    for (const g of geo) {
      if (g.s.pistil) continue;
      const rot = g.dir + g.s.rot;
      ctx.save();
      ctx.translate(g.ex, g.ey);
      ctx.rotate(rot);
      const ag = ctx.createLinearGradient(0, -2.1, 0, 2.1);
      ag.addColorStop(0, "#E9884A");
      ag.addColorStop(0.45, "#C8501E");
      ag.addColorStop(1, "#8C3311");
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.ellipse(0, 0, 5.3, 2.1, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(g.ex, g.ey);
      ctx.rotate(rot);
      ctx.strokeStyle = "rgba(110,36,12,0.55)";
      ctx.lineWidth = 0.35;
      ctx.beginPath();
      ctx.ellipse(0, 0, 5.3, 2.1, 0, 0, TAU);
      ctx.stroke();
      ctx.beginPath(); // pollen sac groove
      ctx.moveTo(-3.8, 0.15);
      ctx.lineTo(3.8, 0.15);
      ctx.strokeStyle = "rgba(120,40,12,0.45)";
      ctx.lineWidth = 0.3;
      ctx.stroke();
      for (let k = 0; k < 5; k++) {
        ctx.fillStyle = tex() < 0.5 ? "rgba(240,150,80,0.8)" : "rgba(130,45,15,0.7)";
        ctx.fillRect(-3.9 + tex() * 7.8, -1.3 + tex() * 2.6, 0.5, 0.5);
      }
      ctx.fillStyle = "rgba(255,210,160,0.65)";
      ctx.beginPath();
      ctx.ellipse(-0.9, -0.8, 2.6, 0.4, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function paintLily(ctx, box, o, L) {
    const art = o.layer === "art";
    const tex = art ? o.rng(L.name + "-tex") : null;
    let front = false;
    for (const T of L.tepals) {
      if (art && T.z === 1 && !front) {
        // the front whorl casts one soft shadow onto the tepals behind it
        front = true;
        const fp = new Path2D();
        for (const F of L.tepals) if (F.z === 1) fp.addPath(F.g.path);
        atopShadow(ctx, o, fp, "rgba(150,40,75,0.30)", 3.2, 0.8, 1.4);
      }
      paintTepal(ctx, o, L, T, tex);
    }
    paintStamens(ctx, o, L, tex);
  }

  /* ---------- back + inside stars ---------- */
  function looseStar(ctx, o, x, y, r, R, T) {
    const jit = [];
    for (let i = 0; i < 10; i++) jit.push(i % 2 ? R.range(0.9, 1.12) : R.range(0.88, 1.06));
    const rot = -Math.PI / 2 + R.range(-0.45, 0.45);
    const p = starPath(x, y, r, R.range(0.47, 0.53), rot, r * 0.12, r * 0.06, jit);
    if (o.layer === "art") {
      ctx.save();
      ctx.shadowColor = "rgba(90,70,30,0.28)";
      ctx.shadowBlur = 1.6 * o.scale;
      ctx.shadowOffsetX = 0.5 * o.scale;
      ctx.shadowOffsetY = 0.8 * o.scale;
      ctx.fillStyle = "#9A781B";
      ctx.fill(p);
      ctx.restore();
      fillGlitter(ctx, o, p, "gold", T);
      ctx.save();
      ctx.clip(p);
      const lg = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
      lg.addColorStop(0, "rgba(255,246,205,0.28)");
      lg.addColorStop(0.55, "rgba(255,246,205,0)");
      lg.addColorStop(1, "rgba(70,45,0,0.2)");
      ctx.fillStyle = lg;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.strokeStyle = "rgba(110,80,14,0.35)";
      ctx.lineWidth = 0.8;
      ctx.stroke(p);
      ctx.restore();
    } else {
      fillGlitter(ctx, o, p, "gold", null);
    }
  }

  K.registerCard({
    id: "lily-stars",
    title: "Starry lilies",
    size: { w: 330, h: 295 },
    bleed: { t: 0.18, r: 0.1, b: 0.09, l: 0.1 },
    paper: "#EADFC0",
    insert: "#FBF7EF",
    ink: "#2B2722",
    foil: "gold",
    message: "Wishing you\na sky full\nof stars.",

    drawCover(ctx, box, layer, o) {
      ctx.save();
      if (layer === "art") paintCardStock(ctx, box, o);
      paintStripes(ctx, box, o);
      paintStars(ctx, box, o);
      const lilies = LILIES.map((spec) => buildLily(spec, o.rng(spec.name), box.w / DW, box.h / DH));
      if (layer === "art") {
        // die-cut layers: soft cast shadow + tight contact shadow on the card (both lilies in one pass)
        const sil = new Path2D();
        for (const L of lilies) sil.addPath(L.sil);
        atopShadow(ctx, o, sil, "rgba(95,62,40,0.30)", 7, 2.6, 4.2);
        atopShadow(ctx, o, sil, "rgba(80,45,30,0.30)", 1.6, 0.6, 1.1);
      }
      for (const L of lilies) paintLily(ctx, box, o, L);
      ctx.restore();
    },

    drawBack(ctx, box, layer, o) {
      const R = o.rng("back-stars");
      const T = layer === "art" ? o.rng("back-tex") : null;
      const { w, h } = box;
      // as seen on the inside-left page (the lily overhangs appear top-left / bottom-right here)
      const pts = [[0.27, 0.32, 21], [0.67, 0.262, 14.5], [0.54, 0.565, 18.5], [0.21, 0.74, 13], [0.73, 0.81, 20]];
      ctx.save();
      for (const [u, v, r] of pts) looseStar(ctx, o, u * w + R.range(-1, 1), v * h + R.range(-1, 1), r, R, T);
      ctx.restore();
    },

    drawInside(ctx, box, layer, o) {
      const R = o.rng("inside-star");
      const T = layer === "art" ? o.rng("inside-tex") : null;
      ctx.save();
      looseStar(ctx, o, box.w / 2, box.h * 0.78, 9.5, R, T);
      ctx.restore();
    },
  });
})();

</script>
<script>
/* ---- card: cherry-blossom ---- */
/* Card 2 — "Cherry blossom": die-cut glitter-edged camellia blossoms on a deep red marker-painted panel.
   Layout comes from the "layout"/"back"/"inside" streams (both layers); texture from "tex" (art layer only). */
(function () {
  "use strict";
  const K = window.KEEPSAKE;
  const TAU = Math.PI * 2;

  /* ---------------- small geometry helpers ---------------- */
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function polyPath(ctx, pts, closed) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (closed) ctx.closePath();
  }

  // Catmull-Rom through control points -> dense polyline
  function spline(cps, per) {
    per = per || 10;
    const out = [];
    for (let i = 0; i < cps.length - 1; i++) {
      const p0 = cps[Math.max(0, i - 1)], p1 = cps[i], p2 = cps[i + 1], p3 = cps[Math.min(cps.length - 1, i + 2)];
      for (let j = 0; j < per; j++) {
        const t = j / per, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    out.push(cps[cps.length - 1].slice());
    return out;
  }

  // shift a polyline sideways by d (positive = left of travel direction)
  function offsetPoly(pts, d) {
    return pts.map((p, i) => {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      return [p[0] + (dy / l) * d, p[1] - (dx / l) * d];
    });
  }

  /* ---------------- glitter edge ----------------
     Strokes a polyline with a band of glitter. Art: the band is stroked with a tile of coloured flecks
     (one device pixel per tile pixel, so flecks stay ~1-2px at any scale) plus a few loose glints.
     Foil: a white stroke of the same band. Flecks come from the art-only texture stream. */
  const ROSE_GLITTER = {
    base: "#A8103E",
    flecks: [["#C8174A", 0.34], ["#DA3A6A", 0.16], ["#F7B3C6", 0.06], ["#820A30", 0.28], ["#E8608C", 0.06], ["#E9EDF2", 0.1]],
    glint: "rgba(250,252,255,1)",
  };
  function glitterPattern(ctx, S) {
    const pal = S.pal || ROSE_GLITTER;
    if (S.pat && S.patPal === pal) return S.pat;
    const T = S.tex, N = 128;
    const c = document.createElement("canvas");
    c.width = c.height = N;
    const x = c.getContext("2d");
    x.fillStyle = pal.base;
    x.fillRect(0, 0, N, N);
    const cum = []; let acc = 0;
    pal.flecks.forEach((f) => { acc += f[1]; cum.push(acc); });
    const paths = pal.flecks.map(() => new Path2D());
    for (let i = 0; i < N * N * 0.55; i++) {
      const s = T() < 0.7 ? 1 : 2, pick = T() * acc;
      let k = 0; while (k < cum.length - 1 && pick > cum[k]) k++;
      paths[k].rect((T() * N) | 0, (T() * N) | 0, s, s);
    }
    paths.forEach((p, k) => { x.fillStyle = pal.flecks[k][0]; x.fill(p); });
    x.fillStyle = pal.glint;
    for (let i = 0; i < N * N * 0.008; i++) x.fillRect((T() * N) | 0, (T() * N) | 0, 1, 1);
    const pat = ctx.createPattern(c, "repeat");
    pat.setTransform(new DOMMatrix([1 / S.scale, 0, 0, 1 / S.scale, 0, 0]));
    S.pat = pat; S.patPal = pal;
    return pat;
  }
  function glitterEdge(ctx, pts, closed, gw, S) {
    ctx.save();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    polyPath(ctx, pts, closed);
    if (S.foil) {
      ctx.lineWidth = gw + 0.3;
      ctx.strokeStyle = "#fff";
      ctx.stroke();
      ctx.restore();
      return;
    }
    const pal = S.pal || ROSE_GLITTER, T = S.tex;
    ctx.lineWidth = gw;
    ctx.strokeStyle = glitterPattern(ctx, S);
    ctx.stroke();
    // loose glints and a few chunkier flakes so the tile never reads as a repeat
    const n = pts.length, segs = closed ? n : n - 1, fs = S.fleck;
    const flakes = new Path2D(), glints = new Path2D();
    for (let i = 0; i < segs; i++) {
      if (T() > 0.42) continue;
      const a = pts[i], b = pts[(i + 1) % n], t = T(), o = (T() - 0.5) * gw;
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const x = a[0] + dx * t - (dy / len) * o, y = a[1] + dy * t + (dx / len) * o, s = fs * (1 + T());
      (T() < 0.4 ? glints : flakes).rect(x - s / 2, y - s / 2, s, s);
    }
    ctx.fillStyle = pal.flecks[0][0]; ctx.fill(flakes);
    ctx.fillStyle = pal.glint; ctx.fill(glints);
    ctx.restore();
  }

  // copy of a closed polygon moved inward by d along vertex normals
  function insetPoly(pts, d) {
    const n = pts.length;
    let A = 0;
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; A += a[0] * b[1] - b[0] * a[1]; }
    const sg = A > 0 ? 1 : -1;
    return pts.map((p, i) => {
      const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      return [p[0] - sg * (dy / l) * d, p[1] + sg * (dx / l) * d];
    });
  }

  // An opaque shape painted over earlier foil must knock the foil out underneath it.
  function knockOut(ctx, S) {
    if (!S.foil) return;
    ctx.save();
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "#000";
    ctx.fill();
    ctx.restore();
  }

  /* ---------------- blossom layout ---------------- */
  // spec: {x, y, R, sq (vertical squash for 3/4 view), rot, cup (inner rings shift, fraction of R), rings?}
  function makeBlossom(L, spec) {
    const R = spec.R;
    // outer ring of broad petals, then a few big cupped petals set off-axis so their cut edges cross the
    // flower (camellia), then a small inner cup around the stamens
    const rings = spec.rings || [
      { n: 5, len: [0.84, 1.04], hw: 0.54, base: 0.1, gw: 1.85, jit: 0.2, tilt: 0.14, shift: 0.03 },
      { n: L.int(3, 4), len: [0.8, 0.92], hw: 0.52, base: 0.08, gw: 1.65, jit: 0.22, tilt: 0.28, shift: 0.08 },
      { n: L.int(2, 3), len: [0.42, 0.54], hw: 0.42, base: 0.05, gw: 1.4, jit: 0.25, tilt: 0.3, shift: 0.06 },
    ];
    const cr = Math.cos(spec.rot || 0), sr = Math.sin(spec.rot || 0), sq = spec.sq || 1;
    const world = (x, y) => { y *= sq; return [spec.x + x * cr - y * sr, spec.y + x * sr + y * cr]; };
    const petals = [];
    const a0 = L() * TAU;
    rings.forEach((rg, k) => {
      const step = TAU / rg.n;
      const off = a0 + k * step * 0.5 + L.range(-0.4, 0.4);
      const cup = (spec.cup || 0) * R * k;
      for (let i = 0; i < rg.n; i++) {
        const ang = off + i * step + L.range(-1, 1) * (rg.jit == null ? 0.16 : rg.jit) * step;
        const axis = ang + L.range(-1, 1) * (rg.tilt || 0);
        const sh = R * (rg.shift || 0) * L.range(-1, 1), sa0 = L() * TAU;
        const ox = Math.cos(sa0) * sh, oy = Math.sin(sa0) * sh - cup;
        const len = R * L.range(rg.len[0], rg.len[1]);
        const hw = R * rg.hw * L.range(0.88, 1.08);
        const rb = R * rg.base;
        const ruf = { k1: L.int(3, 5), p1: L() * TAU, k2: L.int(7, 10), p2: L() * TAU, amp: L.range(0.025, 0.05), notch: L() < 0.55 ? L.range(0.03, 0.07) : 0, skew: L.range(-0.12, 0.12) };
        const ca = Math.cos(axis), sa = Math.sin(axis);
        const tf = (u, v) => world(ox + u * ca - v * sa, oy + u * sa + v * ca);
        petals.push({ ring: k, gw: rg.gw * (spec.gwScale || 1), len, hw, rb, tf, pts: petalOutline(tf, len, hw, rb, ruf) });
      }
    });
    return { spec, petals, center: world(0, -(spec.cup || 0) * R * (rings.length - 0.6)), world };
  }

  function petalOutline(tf, len, hw, rb, ruf) {
    const N = 52, pts = [];
    const c = (rb + len) / 2, a = (len - rb) / 2;
    for (let j = 0; j < N; j++) {
      let s = (j / N) * TAU; // 0 = tip
      const cs = Math.cos(s), sn = Math.sin(s);
      const sw = s > Math.PI ? s - TAU : s; // -pi..pi
      const narrow = 1 - 0.55 * Math.pow(Math.max(0, -cs), 1.3);
      const uu = cs > 0 ? Math.pow(cs, 0.82) : -Math.pow(-cs, 1.05);
      const vv = Math.sign(sn) * Math.pow(Math.abs(sn), 0.8) * narrow;
      const wgt = clamp((cs + 0.35) / 0.8, 0, 1);
      let e = ruf.amp * (0.62 * Math.sin(ruf.k1 * s + ruf.p1) + 0.38 * Math.sin(ruf.k2 * s + ruf.p2)) * wgt;
      e -= ruf.notch * Math.exp(-Math.pow((sw - ruf.skew) / 0.2, 2));
      const u = rb + (c + a * uu - rb) * (1 + e);
      const v = hw * vv * (1 + e) + ruf.skew * hw * 0.25 * Math.max(0, cs);
      pts.push(tf(u, v));
    }
    return pts;
  }

  /* ---------------- blossom painting ---------------- */
  // style: "cover" (pink painted petals on red) or "line" (white petals with glitter outlines, for back/inside)
  function paintBlossom(ctx, B, S, style) {
    const line = style === "line";
    // die-cut shadow onto the panel (art only, clipped to the card rectangle)
    if (!S.foil && !line) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, S.w, S.h); ctx.clip();
      ctx.beginPath();
      B.petals.forEach((p) => { if (p.ring === 0) { ctx.moveTo(p.pts[0][0], p.pts[0][1]); for (const q of p.pts) ctx.lineTo(q[0], q[1]); ctx.closePath(); } });
      ctx.shadowColor = "rgba(45,0,8,0.55)";
      ctx.shadowBlur = 5 * S.scale;
      ctx.shadowOffsetX = 1.4 * S.scale;
      ctx.shadowOffsetY = 2.4 * S.scale;
      ctx.fillStyle = "#C2385F";
      ctx.fill("nonzero");
      ctx.restore();
    }
    for (const p of B.petals) paintPetal(ctx, p, S, line);
    const c = B.center, R = B.spec.R;
    if (line) {
      // open heart of the line flower: the petal bases disappear under a clean paper centre
      ctx.beginPath(); ctx.ellipse(c[0], c[1], R * 0.24, R * 0.24 * Math.max(0.8, B.spec.sq || 1), 0, 0, TAU);
      if (S.foil) knockOut(ctx, S);
      else { ctx.fillStyle = "#FFFCFB"; ctx.fill(); }
    }
    if (!S.foil) {
      // soft throat colour where petals meet
      const g = ctx.createRadialGradient(c[0], c[1], R * 0.08, c[0], c[1], R * (line ? 0.3 : 0.4));
      g.addColorStop(0, line ? "rgba(240,170,120,0.35)" : "rgba(214,72,112,0.55)");
      g.addColorStop(1, line ? "rgba(240,170,120,0)" : "rgba(214,72,112,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c[0], c[1], R * 0.42, 0, TAU); ctx.fill();
    }
    paintStamens(ctx, c, R * (line ? 0.15 : 0.17), S, line, B.spec.sq || 1);
  }

  function paintPetal(ctx, p, S, line) {
    polyPath(ctx, p.pts, true);
    if (S.foil) {
      knockOut(ctx, S);
      glitterEdge(ctx, p.pts, true, p.gw, S);
      return;
    }
    const T = S.tex;
    const base = p.tf(p.rb, 0), tip = p.tf(p.len, 0), mid = p.tf(lerp(p.rb, p.len, 0.64), 0);
    const gr = ctx.createLinearGradient(base[0], base[1], tip[0], tip[1]);
    if (line) {
      gr.addColorStop(0, "#F9E6E8"); gr.addColorStop(0.35, "#FEFAFA"); gr.addColorStop(1, "#FFFFFF");
    } else {
      gr.addColorStop(0, "#DC6F8B"); gr.addColorStop(0.3, "#EE93A8"); gr.addColorStop(0.68, "#F6A8B9"); gr.addColorStop(1, "#F9B6C5");
    }
    ctx.save();
    if (p.ring > 0 && !line) {
      ctx.shadowColor = "rgba(150,18,58,0.5)";
      ctx.shadowBlur = 3.4 * S.scale;
      ctx.shadowOffsetX = 0.5 * S.scale;
      ctx.shadowOffsetY = 1.2 * S.scale;
    }
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.restore();

    if (!line) {
      // soft light on the open face of the petal, a deeper blush at its base, a watercolour bloom
      // (filled through the petal path itself: no clip needed)
      const hr = p.len * 0.45;
      const hg = ctx.createRadialGradient(mid[0], mid[1], 0, mid[0], mid[1], hr);
      hg.addColorStop(0, "rgba(255,222,230,0.5)"); hg.addColorStop(1, "rgba(255,222,230,0)");
      ctx.fillStyle = hg;
      ctx.fill();
      const br = p.len * 0.5;
      const bg0 = ctx.createRadialGradient(base[0], base[1], 0, base[0], base[1], br);
      bg0.addColorStop(0, "rgba(205,62,104,0.45)"); bg0.addColorStop(1, "rgba(205,62,104,0)");
      ctx.fillStyle = bg0;
      ctx.fill();
      const q = p.tf(lerp(p.rb, p.len, 0.35 + T() * 0.55), (T() - 0.5) * p.hw * 1.2), r = p.len * (0.14 + T() * 0.18);
      const bg = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], r);
      const dark = T() < 0.5;
      bg.addColorStop(0, dark ? "rgba(226,104,136,0.24)" : "rgba(255,206,218,0.32)");
      bg.addColorStop(1, dark ? "rgba(226,104,136,0)" : "rgba(255,206,218,0)");
      ctx.fillStyle = bg;
      ctx.fill();
    }
    ctx.save();
    // coloured-pencil deepening just inside the cut edge: rings between the outline and inset copies
    // (even-odd fills instead of a clipped stroke — much cheaper to rasterise)
    const ring = (d, col) => {
      const inner = insetPoly(p.pts, d);
      polyPath(ctx, p.pts, true);
      ctx.moveTo(inner[0][0], inner[0][1]);
      for (let i = inner.length - 1; i > 0; i--) ctx.lineTo(inner[i][0], inner[i][1]);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill("evenodd");
    };
    if (!line) {
      ring(3, "rgba(226,96,130,0.2)");
      ring(1.5, "rgba(206,64,104,0.26)");
      // pencil tooth: fine light and dark grain scattered inside the petal
      const ctr = p.tf((p.rb + p.len) / 2, 0), np = p.pts.length;
      const ng = Math.round(p.len * p.hw * 0.22), lp = new Path2D(), dp = new Path2D(), fs = S.fleck * 1.25;
      for (let i = 0; i < ng; i++) {
        const j = (T() * np) | 0, q0 = p.pts[j], q1 = p.pts[(j + 1) % np], t = T(), k = Math.sqrt(T()) * 0.94;
        const x = lerp(ctr[0], lerp(q0[0], q1[0], t), k), y = lerp(ctr[1], lerp(q0[1], q1[1], t), k), sz = fs * (0.6 + T());
        (T() < 0.5 ? lp : dp).rect(x, y, sz, sz * (0.6 + T() * 0.8));
      }
      ctx.fillStyle = "rgba(255,236,240,0.24)"; ctx.fill(lp);
      ctx.fillStyle = "rgba(200,70,108,0.22)"; ctx.fill(dp);
    } else {
      ring(2.2, "rgba(240,160,185,0.2)");
    }
    // pencil veining: feathered strokes in from the cut edge, longer streaks out from the base
    const nv = line ? 5 + ((T() * 4) | 0) : 14 + ((T() * 10) | 0);
    ctx.lineCap = "round";
    const vp = [new Path2D(), new Path2D(), new Path2D()];
    for (let i = 0; i < nv; i++) {
      const fromEdge = T() < 0.66;
      const v0 = (T() - 0.5) * 2;
      let a, b;
      if (fromEdge) {
        const u0 = lerp(p.rb, p.len, 0.9 - v0 * v0 * 0.28);
        const ln = p.len * (line ? 0.08 + T() * 0.1 : 0.07 + T() * 0.2);
        const vv = v0 * p.hw * 0.8;
        a = [u0, vv]; b = [u0 - ln, vv * (1 - (ln / p.len) * 0.8)];
      } else {
        const ln = p.len * (0.14 + T() * 0.22), sp = (T() - 0.5) * 0.9;
        a = [p.rb + p.len * 0.06, v0 * p.hw * 0.1]; b = [a[0] + ln, a[1] + ln * sp];
      }
      const bend = (T() - 0.5) * p.hw * 0.06;
      const A = p.tf(a[0], a[1]), Bp = p.tf(b[0], b[1]), Cp = p.tf((a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + bend);
      const vk = vp[(T() * 3) | 0];
      vk.moveTo(A[0], A[1]);
      vk.quadraticCurveTo(Cp[0], Cp[1], Bp[0], Bp[1]);
    }
    const vs = line
      ? [[0.35, "rgba(222,96,134,0.35)"], [0.5, "rgba(222,96,134,0.45)"], [0.6, "rgba(214,86,124,0.5)"]]
      : [[0.38, "rgba(184,52,92,0.36)"], [0.55, "rgba(198,66,104,0.42)"], [0.75, "rgba(176,46,88,0.5)"]];
    vp.forEach((pth, k) => { ctx.lineWidth = vs[k][0]; ctx.strokeStyle = vs[k][1]; ctx.stroke(pth); });
    ctx.restore();
    glitterEdge(ctx, p.pts, true, p.gw, S);
  }

  function paintStamens(ctx, c, r, S, line, sq) {
    const ry = Math.max(0.8, sq);
    if (S.foil) {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(c[0], c[1], r * 1.02, r * 1.02 * ry, 0, 0, TAU);
      ctx.fillStyle = line ? "rgba(255,255,255,0.3)" : "rgba(255,255,255,0.5)";
      ctx.fill();
      ctx.restore();
      return;
    }
    const T = S.tex;
    ctx.save();
    // filaments radiating past the pollen heart
    ctx.lineCap = "round";
    const nf = line ? 16 : 12;
    for (let i = 0; i < nf; i++) {
      const a = (i / nf) * TAU + T() * 0.35, l = r * (line ? 1.5 + T() * 1.1 : 1.05 + T() * 0.35);
      ctx.beginPath();
      ctx.moveTo(c[0] + Math.cos(a) * r * 0.5, c[1] + Math.sin(a) * r * 0.5 * ry);
      ctx.lineTo(c[0] + Math.cos(a) * l, c[1] + Math.sin(a) * l * ry);
      ctx.lineWidth = 0.35 + T() * 0.3;
      ctx.strokeStyle = line ? (T() < 0.5 ? "rgba(214,80,120,0.7)" : "rgba(214,150,60,0.75)") : "rgba(190,104,36,0.8)";
      ctx.stroke();
      ctx.beginPath(); ctx.arc(c[0] + Math.cos(a) * l, c[1] + Math.sin(a) * l * ry, line ? 0.45 + T() * 0.3 : 0.6 + T() * 0.4, 0, TAU);
      ctx.fillStyle = line ? "#E2A23A" : "#EDB64E"; ctx.fill();
    }
    const g = ctx.createRadialGradient(c[0] - r * 0.25, c[1] - r * 0.3, r * 0.1, c[0], c[1], r * 1.1);
    g.addColorStop(0, line ? "#F8DFA0" : "#FFD47A");
    g.addColorStop(0.55, line ? "#EDBE62" : "#DE9630");
    g.addColorStop(1, line ? "#D9A050" : "#A4561C");
    ctx.beginPath();
    for (let i = 0; i <= 22; i++) {
      const a = (i / 22) * TAU, rr = r * (0.9 + 0.1 * Math.sin(i * 2.7 + 1) + 0.06 * Math.sin(i * 5.3));
      const x = c[0] + Math.cos(a) * rr, y = c[1] + Math.sin(a) * rr * ry;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.save();
    ctx.translate(r * 0.06, r * 0.1);
    ctx.lineWidth = r * 0.22; ctx.lineJoin = "round";
    ctx.strokeStyle = line ? "rgba(200,120,90,0.25)" : "rgba(150,30,50,0.35)";
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = g;
    ctx.fill();
    // granular pollen: many small beads, each with a shaded underside and a lit top
    const nd = line ? 30 : 70;
    const cols = line ? ["#E9B456", "#F3CF7E", "#D79A3A"] : ["#E6A538", "#F3C25A", "#CF7F1E", "#FBD58A", "#E9A940"];
    const shade = new Path2D(), lit = cols.map(() => new Path2D()), hi = new Path2D();
    for (let i = 0; i < nd; i++) {
      const a = T() * TAU, d = Math.sqrt(T()) * r * 0.92;
      const x = c[0] + Math.cos(a) * d, y = c[1] + Math.sin(a) * d * ry, rr = r * (0.075 + T() * 0.075);
      shade.moveTo(x + rr * 1.3, y + rr * 0.35); shade.arc(x + rr * 0.3, y + rr * 0.35, rr, 0, TAU);
      const k = (T() * cols.length) | 0;
      lit[k].moveTo(x + rr, y); lit[k].arc(x, y, rr, 0, TAU);
      if (T() < 0.3) { hi.moveTo(x - rr * 0.1, y - rr * 0.35); hi.arc(x - rr * 0.35, y - rr * 0.35, rr * 0.35, 0, TAU); }
    }
    ctx.fillStyle = "rgba(130,58,8,0.45)"; ctx.fill(shade);
    lit.forEach((pth, k) => { ctx.fillStyle = cols[k]; ctx.fill(pth); });
    ctx.fillStyle = "rgba(255,248,215,0.85)"; ctx.fill(hi);
    for (let i = 0; i < (line ? 3 : 6); i++) {
      const a = T() * TAU, d = Math.sqrt(T()) * r * 0.8;
      const x = c[0] + Math.cos(a) * d, y = c[1] + Math.sin(a) * d * ry, s = r * 0.09;
      ctx.fillStyle = "rgba(255,252,235,0.95)";
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
    ctx.restore();
  }

  /* ---------------- leaves, stems, buds ---------------- */
  // lanceolate leaf from base b to tip t, max width wd, bend = sideways bow of the midrib
  function leafShape(b, t, wd, bend) {
    const dx = t[0] - b[0], dy = t[1] - b[1], l = Math.hypot(dx, dy);
    const nx = -dy / l, ny = dx / l, N = 22;
    const mid = [], left = [], right = [];
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      const m = [b[0] + dx * s + nx * bend * Math.sin(Math.PI * s), b[1] + dy * s + ny * bend * Math.sin(Math.PI * s)];
      const hw = (wd / 2) * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.78)), 0.9);
      mid.push(m);
      left.push([m[0] + nx * hw, m[1] + ny * hw]);
      right.push([m[0] - nx * hw, m[1] - ny * hw]);
    }
    return { mid, left, right, outline: left.concat(right.slice().reverse()), nx, ny, l };
  }

  function paintLeaf(ctx, lf, S, tone) {
    polyPath(ctx, lf.outline, true);
    if (S.foil) { knockOut(ctx, S); return; }
    const T = S.tex;
    const greens = tone ? ["#3E964A", "#2C7A3A", "#62AE68"] : ["#48A053", "#33833F", "#6DB873"];
    ctx.save();
    ctx.fillStyle = greens[0];
    ctx.fill();
    // folded half in the darker green
    ctx.beginPath();
    ctx.moveTo(lf.mid[0][0], lf.mid[0][1]);
    lf.left.forEach((q) => ctx.lineTo(q[0], q[1]));
    for (let i = lf.mid.length - 1; i >= 0; i--) ctx.lineTo(lf.mid[i][0], lf.mid[i][1]);
    ctx.closePath();
    ctx.fillStyle = greens[1];
    ctx.globalAlpha = 0.55;
    ctx.fill();
    ctx.globalAlpha = 1;
    // marker streaks along the blade (kept inside the blade by construction, so no clip is needed)
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const lightS = new Path2D(), darkS = new Path2D(), last = lf.mid.length - 1;
    for (let i = 0; i < 11; i++) {
      const off = (T() - 0.5) * 1.2, s0 = 0.1 + T() * 0.25, s1 = 0.55 + T() * 0.27;
      const pth = T() < 0.55 ? lightS : darkS;
      for (let k = 0; k <= 6; k++) {
        const sv = lerp(s0, s1, k / 6), idx = Math.round(sv * last);
        const m = lf.mid[idx], L = lf.left[idx];
        const x = lerp(m[0], L[0], off), y = lerp(m[1], L[1], off);
        k ? pth.lineTo(x, y) : pth.moveTo(x, y);
      }
    }
    ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(150,218,140,0.22)"; ctx.stroke(lightS);
    ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(24,84,36,0.2)"; ctx.stroke(darkS);
    // edge darkening: a thin ring just inside the outline
    const inner = insetPoly(lf.outline, 1.1);
    polyPath(ctx, lf.outline, true);
    ctx.moveTo(inner[0][0], inner[0][1]);
    for (let i = inner.length - 1; i > 0; i--) ctx.lineTo(inner[i][0], inner[i][1]);
    ctx.closePath();
    ctx.fillStyle = "rgba(25,90,40,0.38)";
    ctx.fill("evenodd");
    ctx.restore();
    // midrib
    const rib = lf.mid.slice(1, Math.round(lf.mid.length * 0.88));
    polyPath(ctx, rib, false);
    ctx.lineCap = "round";
    ctx.lineWidth = 0.75;
    ctx.strokeStyle = "rgba(30,100,48,0.85)";
    ctx.stroke();
    polyPath(ctx, offsetPoly(rib, 0.6), false);
    ctx.lineWidth = 0.4;
    ctx.strokeStyle = "rgba(170,230,170,0.45)";
    ctx.stroke();
    polyPath(ctx, lf.outline, true);
    ctx.lineJoin = "round";
    ctx.lineWidth = 0.55;
    ctx.strokeStyle = "#2D7A39";
    ctx.stroke();
  }

  function paintStem(ctx, pts, sw, S) {
    if (S.foil) return; // stems sit under every foil element
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    polyPath(ctx, pts, false);
    ctx.lineWidth = sw + 1.1; ctx.strokeStyle = "#2D7A39"; ctx.stroke();
    ctx.lineWidth = sw; ctx.strokeStyle = "#3E9B4A"; ctx.stroke();
    polyPath(ctx, offsetPoly(pts, sw * 0.24), false);
    ctx.lineWidth = sw * 0.3; ctx.strokeStyle = "rgba(128,204,128,0.5)"; ctx.stroke();
    polyPath(ctx, offsetPoly(pts, -sw * 0.3), false);
    ctx.lineWidth = sw * 0.22; ctx.strokeStyle = "rgba(30,100,45,0.35)"; ctx.stroke();
    ctx.restore();
  }

  // closed bud: base point, tip point, half width
  function makeBud(L, b, t, wb) {
    const dx = t[0] - b[0], dy = t[1] - b[1], l = Math.hypot(dx, dy);
    const ux = dx / l, uy = dy / l, nx = -uy, ny = ux;
    const P = (s, w) => [b[0] + ux * s * l + nx * w, b[1] + uy * s * l + ny * w];
    const hwAt = (s) => wb * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.8)), 0.68) * (1 - 0.1 * s);
    const N = 26, left = [], right = [];
    for (let i = 0; i <= N; i++) { const s = i / N, h = hwAt(s); left.push(P(s, h)); right.push(P(s, -h)); }
    const full = left.concat(right.slice(1, -1).reverse());
    // a wrapping front petal: up the right side to near the tip, then sweeping down across to the left side
    const sk = L.range(0.82, 0.9), sl = L.range(0.3, 0.42);
    const wrap = [];
    for (let i = 0; i <= N; i++) { const s = (i / N) * sk; wrap.push(P(s, -hwAt(s))); }
    for (let i = 1; i <= 14; i++) {
      const q = i / 14, s = lerp(sk, sl, q);
      const w = lerp(-hwAt(sk), hwAt(sl), Math.pow(q, 0.8)) + Math.sin(q * Math.PI) * wb * 0.18;
      wrap.push(P(s, w));
    }
    for (let i = Math.round(sl * N); i >= 0; i--) { const s = i / N; wrap.push(P(s, hwAt(s))); }
    const sepals = [
      leafShape(P(0.0, 0), P(0.36, wb * 0.15), wb * 0.6, 0),
      leafShape(P(-0.02, 0), P(0.56, wb * 1.0), wb * 0.95, -wb * 0.12),
      leafShape(P(-0.02, 0), P(0.5, -wb * 0.98), wb * 0.9, wb * 0.12),
    ];
    return { full, wrap, sepals, P, l, wb };
  }

  function paintBud(ctx, bud, S) {
    // die-cut shadow
    if (!S.foil) {
      ctx.save();
      polyPath(ctx, bud.full, true);
      ctx.shadowColor = "rgba(45,0,8,0.5)";
      ctx.shadowBlur = 4 * S.scale; ctx.shadowOffsetX = 1.2 * S.scale; ctx.shadowOffsetY = 2 * S.scale;
      ctx.fillStyle = "#C2385F"; ctx.fill();
      ctx.restore();
    }
    const fake = (pts, k) => ({ ring: k, gw: 1.55, pts, len: bud.l, hw: bud.wb, rb: 0, tf: (u, v) => bud.P(u / bud.l, v) });
    paintPetal(ctx, fake(bud.full, 0), S, false);
    paintPetal(ctx, fake(bud.wrap, 1), S, false);
    bud.sepals.forEach((sp, i) => paintLeaf(ctx, sp, S, i % 2 === 0));
  }

  /* ---------------- the red marker-painted panel ---------------- */
  // the red panel sits on a white base card that shows as a rim along the right and bottom
  const panelRect = (w, h) => ({ x0: 1.0, y0: 1.1, x1: w - w * 0.02, y1: h - h * 0.016 });
  function paintPanel(ctx, w, h, T, scale) {
    // white card base peeks out as a thin rim
    ctx.fillStyle = "#F6F4F2";
    ctx.fillRect(0, 0, w, h);
    const { x0, y0, x1, y1 } = panelRect(w, h);
    ctx.save();
    ctx.shadowColor = "rgba(60,10,15,0.35)";
    ctx.shadowBlur = 2 * scale; ctx.shadowOffsetX = 0.6 * scale; ctx.shadowOffsetY = 0.8 * scale;
    ctx.fillStyle = "#B20C1F";
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    const g = ctx.createLinearGradient(0, 0, w * 0.6, h);
    g.addColorStop(0, "#C8132A"); g.addColorStop(0.5, "#BC1026"); g.addColorStop(1, "#A00C1D");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    // mottling
    for (let i = 0; i < 34; i++) {
      const x = T() * w, y = T() * h, r = 14 + T() * 42, light = T() < 0.5;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, light ? "rgba(222,34,52,0.16)" : "rgba(110,0,14,0.16)");
      rg.addColorStop(1, light ? "rgba(222,34,52,0)" : "rgba(110,0,14,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // alcohol-marker streaks: long overlapping strokes with darker overlap edges
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = 0; i < 90; i++) {
      const x = T() * (w + 40) - 20, y = T() * (h + 40) - 20;
      const ang = -Math.PI / 2 + 0.35 + (T() - 0.5) * 0.5, len = 50 + T() * 140;
      const cx = x + Math.cos(ang) * len * 0.5 + (T() - 0.5) * 16, cy = y + Math.sin(ang) * len * 0.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(cx, cy, x + Math.cos(ang) * len, y + Math.sin(ang) * len);
      const lw = 3.5 + T() * 5;
      const k = T();
      ctx.lineWidth = lw;
      ctx.strokeStyle = k < 0.45 ? `rgba(222,30,52,${0.07 + T() * 0.08})` : k < 0.85 ? `rgba(118,0,16,${0.06 + T() * 0.07})` : `rgba(240,74,88,${0.05 + T() * 0.06})`;
      ctx.stroke();
      if (T() < 0.5) {
        ctx.lineWidth = 0.5;
        ctx.strokeStyle = "rgba(95,0,12,0.12)";
        ctx.stroke();
      }
    }
    // fine speckle of lighter pigment and dark grain
    const lightP = new Path2D(), darkP = new Path2D(), pinkP = new Path2D();
    const fs = Math.max(0.4, 1 / scale);
    for (let i = 0; i < 3200; i++) {
      const x = T() * w, y = T() * h, s = fs * (0.6 + T() * 1.1), k = T();
      (k < 0.45 ? lightP : k < 0.9 ? darkP : pinkP).rect(x, y, s, s);
    }
    ctx.fillStyle = "rgba(240,90,100,0.22)"; ctx.fill(lightP);
    ctx.fillStyle = "rgba(80,0,10,0.22)"; ctx.fill(darkP);
    ctx.fillStyle = "rgba(255,170,180,0.3)"; ctx.fill(pinkP);
    // gentle vignette
    const v = ctx.createRadialGradient(w * 0.5, h * 0.45, Math.min(w, h) * 0.3, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
    v.addColorStop(0, "rgba(70,0,10,0)"); v.addColorStop(1, "rgba(70,0,10,0.28)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  }

  /* ---------------- scene layout (shared by both layers) ---------------- */
  function coverScene(L) {
    const blossoms = [
      // back-to-front
      makeBlossom(L, { x: 197, y: 50, R: 60, sq: 0.74, rot: -0.12, cup: -0.05 }),   // top-right, 3/4 view, overflows right
      makeBlossom(L, { x: 185, y: 203, R: 51, sq: 0.94, rot: 0.1, cup: 0.0 }),     // centre-right
      makeBlossom(L, { x: 79, y: 36, R: 58, sq: 0.93, rot: 0.05, cup: 0.0 }),      // top-centre, overflows top
      makeBlossom(L, { x: 45, y: 142, R: 61, sq: 0.84, rot: -0.06, cup: 0.0 }),    // mid-left, overflows left
      makeBlossom(L, { x: 59, y: 285, R: 58, sq: 0.92, rot: 0.0, cup: 0.0 }),      // bottom-left, overflows left/bottom
    ];
    const buds = [
      makeBud(L, [197, 143], [222, 96], 17.5),   // right-middle
      makeBud(L, [102, 220], [100, 172], 16.5),    // small, centre-left
    ];
    const main = spline([[124, 322], [126, 276], [132, 238], [137, 190], [141, 150], [143, 108], [145, 60], [147, -2]], 12);
    const branch = spline([[126, 272], [114, 254], [100, 237], [87, 222], [77, 206], [71, 186]], 10);
    const budStemL = spline([[115, 254], [108, 238], [103, 224]], 8);
    const budStemR = spline([[189, 188], [193, 168], [198, 143]], 8);
    const leaves = [
      { b: [142, 88], t: [120, 56], wd: 13, bend: 2.5, tone: 1 },
      { b: [151, 102], t: [177, 68], wd: 15.5, bend: -2.5, tone: 0 },
      { b: [141, 129], t: [102, 88], wd: 20, bend: 3.5, tone: 1 },
      { b: [99, 166], t: [135, 140], wd: 16.5, bend: -2.5, tone: 0 },
      { b: [80, 213], t: [20, 221], wd: 23, bend: -5, tone: 1 },
      { b: [199, 164], t: [240, 142], wd: 17, bend: -3, tone: 0 },
      { b: [134, 263], t: [169, 225], wd: 17, bend: 3, tone: 1 },
      { b: [100, 305], t: [115, 335], wd: 13, bend: 2, tone: 0 },
    ].map((d) => Object.assign({ shape: leafShape(d.b, d.t, d.wd * L.range(0.95, 1.05), d.bend) }, d));
    return { blossoms, buds, main, branch, budStemL, budStemR, leaves };
  }

  function texState(box, layer, opts, texName) {
    const sc = opts.scale || 2;
    return {
      foil: layer === "foil",
      tex: layer === "foil" ? null : opts.rng(texName),
      scale: sc,
      fleck: clamp(1.35 / sc, 0.45, 0.9),
      w: box.w, h: box.h,
    };
  }

  K.registerCard({
    id: "cherry-blossom",
    title: "Cherry blossom",
    size: { w: 240, h: 320 },
    bleed: { t: 0.08, r: 0.1, b: 0.06, l: 0.065 },
    paper: "#F4F2F0",
    insert: "#FBF8F2",
    ink: "#2B2722",
    foil: "rose",
    message: "Some people\nfeel like spring.\nYou do.",

    drawCover(ctx, box, layer, opts) {
      const S = texState(box, layer, opts, "tex");
      const scene = coverScene(opts.rng("layout"));
      if (!S.foil) {
        paintPanel(ctx, box.w, box.h, S.tex, S.scale);
        // painted stems stay on the panel
        const pr = panelRect(box.w, box.h);
        ctx.save();
        ctx.beginPath(); ctx.rect(pr.x0, pr.y0, pr.x1 - pr.x0, pr.y1 - pr.y0); ctx.clip();
        paintStem(ctx, scene.main, 8.4, S);
        paintStem(ctx, scene.branch, 7, S);
        paintStem(ctx, scene.budStemL, 5.4, S);
        paintStem(ctx, scene.budStemR, 5.4, S);
        ctx.restore();
      }
      scene.leaves.forEach((lf) => paintLeaf(ctx, lf.shape, S, lf.tone));
      scene.buds.forEach((b) => paintBud(ctx, b, S));
      scene.blossoms.forEach((b) => paintBlossom(ctx, b, S, "cover"));
    },

    drawBack(ctx, box, layer, opts) {
      const S = texState(box, layer, opts, "tex");
      S.pal = {
        base: "#B51C47",
        flecks: [["#C4204A", 0.36], ["#D8456F", 0.2], ["#F4B0C2", 0.08], ["#8E1137", 0.26], ["#E2577F", 0.1]],
        glint: "rgba(255,248,250,0.95)",
      };
      const L = opts.rng("back"), w = box.w, h = box.h;
      const big = makeBlossom(L, {
        x: w * 0.54, y: h * 0.36, R: w * 0.27, sq: 0.92, rot: 0.2, gwScale: 1.55,
        rings: [
          { n: 5, len: [0.92, 1.02], hw: 0.52, base: 0.12, gw: 2.4 },
          { n: 4, len: [0.6, 0.7], hw: 0.44, base: 0.08, gw: 2.0 },
        ],
      });
      const small = makeBlossom(L, {
        x: w * 0.27, y: h * 0.755, R: w * 0.145, sq: 0.9, rot: -0.3, gwScale: 1.15,
        rings: [
          { n: 5, len: [0.92, 1.02], hw: 0.52, base: 0.12, gw: 2.2 },
          { n: 4, len: [0.6, 0.7], hw: 0.44, base: 0.08, gw: 1.8 },
        ],
      });
      paintBlossom(ctx, big, S, "line");
      paintBlossom(ctx, small, S, "line");
    },

    drawInside(ctx, box, layer, opts) {
      const S = texState(box, layer, opts, "tex");
      S.pal = {
        base: "#B92050",
        flecks: [["#C92E60", 0.36], ["#E2577F", 0.22], ["#F7B6C8", 0.1], ["#97173F", 0.32]],
        glint: "rgba(255,248,250,0.9)",
      };
      const L = opts.rng("inside"), w = box.w, h = box.h;
      const b = makeBlossom(L, {
        x: w * 0.5, y: h * 0.715, R: 22, sq: 0.94, rot: 0.4, gwScale: 0.72,
        rings: [
          { n: 5, len: [0.92, 1.02], hw: 0.52, base: 0.12, gw: 1.6 },
          { n: 4, len: [0.6, 0.7], hw: 0.44, base: 0.08, gw: 1.4 },
        ],
      });
      paintBlossom(ctx, b, S, "line");
    },
  });
})();

<script>
/* ---- card: mothers-day ---- */
/* Card 3 — "Mother's Day lily": a watercolour stargazer lily on grey-white cold-press paper with
   gold-foil anthers and gold-foil lettering. The back of the cover repeats the lily as a mirrored
   sepia-rose line drawing; the inside carries a tiny line-drawn sketch under the message. See CONTRACT.md. */
(function () {

  const K = window.KEEPSAKE;

    },

      shade: 0.45, hl: [0.45], mid: 0.1, crease: [[-0.2, 0.25, 0.95]], band: [[-1, -0.2, 0.25, 1, 0.22]], dark: [[606, 612, 28]],

      B: [[378, 502], [300, 514], [222, 538], [162, 566], [110, 596], [60, 606], [34, 588], [21, 548], [17, 500]],
      shade: 0.35, hl: [0.4], mid: 0.0, crease: [[-0.4, 0.3, 0.97]], band: [[-1, -0.4, 0.3, 1, 0.25]], dark: [[40, 525, 22], [128, 572, 18]],
    },
    // the front tepal, curling toward the viewer; its rolled lip sits over the throat
    fr: {
      A: [[422, 494], [360, 478], [290, 478], [222, 490], [176, 520], [156, 575], [160, 635], [186, 695], [222, 740], [260, 762]],
      B: [[444, 512], [420, 550], [382, 576], [334, 600], [298, 640], [277, 690], [268, 735], [260, 762]],
      shade: -0.55, hl: [-0.2], mid: -0.05, crease: [[0.42, 0.18, 0.92]], band: [[0.42, 1, 0.12, 0.97, 0.3]], dark: [[214, 610, 26], [236, 704, 18]],
      lip: [[444, 506], [440, 540], [410, 562], [366, 560], [338, 540], [336, 512], [372, 492], [420, 492]],
    },
  };
  // painter's order: back tepals, throat, stamens, then the front tepal over the stamen bases
  const BACK_ORDER = ["ul", "ur", "top", "curl", "lr", "ll"];
  const BBOX = { x0: 17, x1: 670, y0: 72, y1: 762 };
  // stamens: anther centre, long-axis angle (deg), filament origin offset from the throat
  const ANTHERS = [
    { c: [208, 256], a: 40, o: [-6, -6] },
    { c: [290, 241], a: 50, o: [-2, -8] },
    { c: [356, 268], a: 80, o: [4, -10] },
    { c: [208, 328], a: 36, o: [-8, -2] },
    { c: [242, 398], a: 34, o: [-6, 4] },
    { c: [326, 352], a: 60, o: [0, -4] },
  ];
  const PISTIL = { c: [276, 300] };
  const ANTHER_LEN = 50, ANTHER_WID = 20;

  /* ---------- geometry helpers ---------- */
  // Catmull-Rom through pts, then resampled to n+1 points evenly spaced by arc length
  function edgeCurve(pts, n) {
    const dense = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      for (let j = 0; j < 10; j++) {
        const t = j / 10, t2 = t * t, t3 = t2 * t;
        const f = (k) => 0.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
        dense.push([f(0), f(1)]);
      }
    }
    dense.push(pts[pts.length - 1]);
    const cum = [0];
    for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]));
    const total = cum[cum.length - 1], out = [];
    let j = 1;
    for (let k = 0; k <= n; k++) {
      const s = (total * k) / n;
      while (j < dense.length - 1 && cum[j] < s) j++;
      const a = dense[j - 1], b = dense[j], f = (s - cum[j - 1]) / (cum[j] - cum[j - 1] || 1);
      out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
    }
    return out;
  }
  // ref space → card units: uniform scale s, optional horizontal mirror; (cx, top) places the bbox
  function makeMap(s, cx, top, mirror) {
    const mid = (BBOX.x0 + BBOX.x1) / 2, mx = mirror ? -1 : 1;
    const m = (p) => [cx + mx * (p[0] - mid) * s, top + (p[1] - BBOX.y0) * s];
    m.s = s;
    m.mirror = !!mirror;
    return m;
  }
  // smooth closed / open path through points (quadratic through midpoints)
  function smoothPath(path, pts, closed) {
    const n = pts.length;
    if (closed) {
      path.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        path.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      }
      path.closePath();
    } else {
      path.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < n - 1; i++) {
        const p = pts[i], q = pts[i + 1];
        path.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      }
      path.lineTo(pts[n - 1][0], pts[n - 1][1]);
    }
    return path;
  }

  // Build one tepal in card units. L (layout stream) is consumed identically in every layer.
  const geoCache = {};
  function buildPetal(key, M, L) {
    const d = PETALS[key], N = 40;

  /* ------------------------------------------------------------------ */
  /* small drawing helpers                                               */

  /* cold-press paper tooth: tileable embossed value-noise (cached)      */

  /* ------------------------------------------------------------------ */
  /* watercolour tepal                                                   */

    g.restore();
    // 13 — fine stamped outline in grey-mauve, slightly stippled like a pigment pen
    g.strokeStyle = rgba(C.outline, 0.78);
    g.lineWidth = 0.55 * k;
    g.stroke(p.edge);
    g.fillStyle = rgba(C.outline, 0.7);
    walk(p.edgePts, 0.55 * k, (x, y, nx, ny) => {
      if (T() < 0.6) {
        const j = T.range(-0.45, 0.35) * k, s = (0.35 + T() * 0.55) * k;
        g.fillRect(x + nx * j - s / 2, y + ny * j - s / 2, s, s);
      }
    });
  }

  function paintFilaments(g, F) {
    const s = F.M.s / 0.31;
    g.save();
    g.shadowColor = "rgba(150,50,85,0.32)";
    g.shadowBlur = 1.2 * F.scale;
    g.shadowOffsetX = 0.4 * F.scale;
    g.shadowOffsetY = 0.6 * F.scale;
    // pistil (style + three-lobed stigma)
    const pp = curvePts(F.pistil.origin, F.pistil.tip, F.pistil.bend, 18);
    let gr = g.createLinearGradient(pp[0][0], pp[0][1], F.pistil.tip[0], F.pistil.tip[1]);
    gr.addColorStop(0, "#7E9238");
    gr.addColorStop(1, "#A2A64A");
    g.fillStyle = gr;
    taper(g, pp, 2.0 * s, 1.3 * s);
    g.fill();
    g.fillStyle = "#94984A";
    for (let i = 0; i < 3; i++) {
      const an = -2.3 + i * 0.75;
      g.beginPath();
      g.arc(F.pistil.tip[0] + Math.cos(an) * 1.1 * s, F.pistil.tip[1] + Math.sin(an) * 1.1 * s, 1.25 * s, 0, TAU);
      g.fill();
    }
    for (const st of F.stamens) {
      const pts = curvePts(st.origin, st.attach, st.bend, 16);
      gr = g.createLinearGradient(st.origin[0], st.origin[1], st.attach[0], st.attach[1]);
      gr.addColorStop(0, "#80943A");
      gr.addColorStop(0.55, "#A9AA4A");
      gr.addColorStop(1, "#C4AE58");
      g.fillStyle = gr;
      taper(g, pts, 2.1 * s, 1.15 * s);
      g.fill();
    }
    g.restore();
    // highlights along the filaments
    g.strokeStyle = "rgba(240,244,190,0.5)";
    g.lineWidth = 0.35 * s;
    g.lineCap = "round";
    for (const st of F.stamens) {
      polyline(g, curvePts(st.origin, st.attach, st.bend, 16).slice(2, -2).map((q) => [q[0] - 0.25 * s, q[1] - 0.3 * s]));
      g.stroke();
    }
    g.fillStyle = "rgba(235,240,180,0.7)";
    g.beginPath();
    g.arc(F.pistil.tip[0] - 0.6 * s, F.pistil.tip[1] - 0.7 * s, 0.7 * s, 0, TAU);
    g.fill();
  }

  // gold-foil anthers: art = gold gradient + grain, foil = white of the same shape
  function paintAnthers(ctx, F, layer, T, soft) {
    if (layer === "foil") {
      ctx.fillStyle = "#fff";
      for (const s of F.stamens) { antherPath(ctx, s); ctx.fill(); }
      return;
    }
    const scale = F.scale;
    for (const s of F.stamens) {
      // contact shadow on the petal
      ctx.save();
      ctx.shadowColor = "rgba(110,40,60,0.4)";
      ctx.shadowBlur = 1.4 * scale;
      ctx.shadowOffsetX = 0.45 * scale;
      ctx.shadowOffsetY = 0.75 * scale;
      antherPath(ctx, s);
      ctx.fillStyle = "#9A7228";
      ctx.fill();
      ctx.restore();
      ctx.save();
      antherPath(ctx, s);
      ctx.clip();
      // across the anther, from its upper (lit) side to its lower side
      let nx = -Math.sin(s.ang), ny = Math.cos(s.ang);
      if (ny < 0) { nx = -nx; ny = -ny; }
      const hw = s.wid / 2, R = s.len / 2;
      const gr = ctx.createLinearGradient(s.c[0] - nx * hw, s.c[1] - ny * hw, s.c[0] + nx * hw, s.c[1] + ny * hw);
      const pal = soft ? ["#EAD39C", "#D2AF66", "#B08A45", "#86672F"] : ["#E2C27A", "#BE9442", "#8E6828", "#5A3F18"];
      gr.addColorStop(0, pal[0]);
      gr.addColorStop(0.3, pal[1]);
      gr.addColorStop(0.65, pal[2]);
      gr.addColorStop(1, pal[3]);
      ctx.fillStyle = gr;
      ctx.fillRect(s.c[0] - R - 1, s.c[1] - R - 1, R * 2 + 2, R * 2 + 2);
      // pollen grain / foil glitter
      const n = Math.round(R * hw * (soft ? 2.5 : 5));
      const cols = ["rgba(255,236,180,0.75)", "rgba(100,70,22,0.5)", "rgba(214,180,96,0.7)", "rgba(80,54,18,0.45)", "rgba(238,214,140,0.6)"];
      const ca = Math.cos(s.ang), sa = Math.sin(s.ang);
      for (let i = 0; i < n; i++) {
        const a = T() * TAU, rr = Math.sqrt(T());
        const x = s.c[0] + ca * Math.cos(a) * rr * R - sa * Math.sin(a) * rr * hw;
        const y = s.c[1] + sa * Math.cos(a) * rr * R + ca * Math.sin(a) * rr * hw;
        const z = 0.28 + T() * 0.42;
        ctx.fillStyle = cols[(T() * cols.length) | 0];
        ctx.fillRect(x - z / 2, y - z / 2, z, z);
      }
      // specular ridge along the lit side
      ctx.strokeStyle = "rgba(255,248,215,0.7)";
      ctx.lineWidth = Math.max(0.35, s.wid * 0.13);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(s.c[0] - ca * R * 0.6 - nx * hw * 0.45, s.c[1] - sa * R * 0.6 - ny * hw * 0.45);
      ctx.lineTo(s.c[0] + ca * R * 0.45 - nx * hw * 0.45, s.c[1] + sa * R * 0.45 - ny * hw * 0.45);
      ctx.stroke();
      ctx.restore();
      antherPath(ctx, s);
      ctx.strokeStyle = "rgba(100,68,22,0.6)";
      ctx.lineWidth = 0.3;
      ctx.stroke();
    }
  }

  /* ------------------------------------------------------------------ */
  /* cover lettering                                                     */
  /* ------------------------------------------------------------------ */
  const FONT = (s) => "600 " + s.toFixed(2) + 'px "Josefin Sans", "Futura", "Century Gothic", sans-serif';
  // user-perceived characters: emoji ZWJ sequences, skin tones and flags stay whole when spaced out
  const SEG = typeof Intl !== "undefined" && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: "grapheme" }) : null;
  const graphemes = (s) => (SEG ? Array.from(SEG.segment(s), (x) => x.segment) : Array.from(s));
  const MIN_SIZE = 7; // card units: smaller lettering is unreadable, so overlong lines are cut with an ellipsis
  function coverLines(text) {
    let lines = String(text == null ? "" : text).toUpperCase().replace(/'/g, "’").split(/\r?\n/).map((s) => s.trim());
    while (lines.length && !lines[0]) lines.shift();
    while (lines.length && !lines[lines.length - 1]) lines.pop();
    if (lines.length > 4) lines = lines.slice(0, 3).concat([lines.slice(3).join(" ")]);
    return lines;
  }
  // split a line at the word break that best balances the two halves
  function splitLine(line) {
    const words = line.split(/\s+/);
    if (words.length < 2) return null;
    let best = null;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(" "), b = words.slice(i).join(" "), d = Math.abs(a.length - b.length);
      if (!best || d < best.d) best = { a, b, d };
    }
    return [best.a, best.b];
  }
  function layoutText(ctx, box, lines) {
    const baseSize = (n) => (n <= 2 ? 14 : n === 3 ? 12.5 : 11);
    const measure = (sz) => {
      ctx.font = FONT(sz);
      const sp = 0.18 * sz;
      return lines.map((ln) => {
        const ch = graphemes(ln), ws = ch.map((c) => ctx.measureText(c).width);
        const tot = ws.reduce((a, b) => a + b, 0) + sp * Math.max(0, ch.length - 1);
        return { ch, ws, tot, sp };
      });
    };
    ctx.save();
    // a long single line would shrink to nothing: wrap it at a word break instead (up to 3 lines)
    for (let guard = 0; guard < 2 && lines.length < 3; guard++) {
      const mm = measure(baseSize(lines.length));
      let wi = 0;
      mm.forEach((x, i) => { if (x.tot > mm[wi].tot) wi = i; });
      if (mm[wi].tot * 0.7 <= box.w * 0.8) break;
      const sp = splitLine(lines[wi]);
      if (!sp) break;
      lines = lines.slice(0, wi).concat(sp, lines.slice(wi + 1));
    }
    const n = lines.length;
    let size = baseSize(n);
    let pitch = n <= 2 ? box.h * 0.07 : n === 3 ? 18.5 : 15.5;
    let m = measure(size);
    const maxW = Math.max(1, ...m.map((x) => x.tot));
    if (maxW > box.w * 0.8) {
      const f = (box.w * 0.8) / maxW;
      size = Math.max(MIN_SIZE, size * f);
      pitch *= Math.max(0.8, f);
      m = measure(size);
      // still too wide at the smallest legible size: cut the line and end it with an ellipsis
      const lim = box.w * 0.86;
      m.forEach((ln) => {
        if (ln.tot <= lim) return;
        ctx.save();
        ctx.font = FONT(size);
        const ell = ctx.measureText("…").width;
        ctx.restore();
        while (ln.ch.length > 1 && ln.tot + ln.sp + ell > lim) {
          ln.tot -= ln.ws.pop() + ln.sp;
          ln.ch.pop();
        }
        ln.ch.push("…"); ln.ws.push(ell); ln.tot += ln.sp + ell;
      });
    }
    ctx.font = FONT(size);
    const hm = ctx.measureText("H");
    const cap = hm.actualBoundingBoxAscent > 0 ? hm.actualBoundingBoxAscent : size * 0.7;
    ctx.restore();
    const yc = box.h * 0.835, glyphs = [];
    let top = 1e9, bottom = -1e9;
    m.forEach((ln, i) => {
      const cy = yc + (i - (n - 1) / 2) * pitch, base = cy + cap / 2;
      let x = box.w / 2 - ln.tot / 2;
      ln.ch.forEach((c, j) => { glyphs.push({ c, x, y: base, line: i }); x += ln.ws[j] + ln.sp; });
      top = Math.min(top, base - cap);
      bottom = Math.max(bottom, base + size * 0.12);
    });
    return { font: FONT(size), size, cap, glyphs, top, bottom, n };
  }
  function drawGlyphs(g, lay, dx, dy) {
    g.font = lay.font;
    g.textAlign = "left";
    g.textBaseline = "alphabetic";
    for (const q of lay.glyphs) g.fillText(q.c, q.x + dx, q.y + dy);
  }
  function drawLettering(ctx, box, layer, opts) {
    const lines = coverLines(opts.text);
    if (!lines.length) return;
    const lay = layoutText(ctx, box, lines);
    if (layer === "foil") {
      ctx.save();
      ctx.fillStyle = "#fff";
      drawGlyphs(ctx, lay, 0, 0);
      ctx.restore();
      return;
    }
    const sc = opts.scale, T = opts.rng("foilgrain");
    // gold foil lettering rendered on its own strip, then grained with flecks (source-atop)
    const y0 = Math.floor((lay.top - 3) * sc) / sc, y1 = lay.bottom + 3;
    const oc = document.createElement("canvas");
    oc.width = Math.max(1, Math.ceil(box.w * sc));
    oc.height = Math.max(1, Math.ceil((y1 - y0) * sc));
    const g = oc.getContext("2d");
    g.setTransform(sc, 0, 0, sc, 0, -y0 * sc);
    for (let i = 0; i < lay.n; i++) {
      const gl = lay.glyphs.filter((q) => q.line === i);
      if (!gl.length) continue;
      const base = gl[0].y;
      const gr = g.createLinearGradient(0, base - lay.cap, 0, base);
      gr.addColorStop(0, "#A3895A");
      gr.addColorStop(0.4, "#8E7442");
      gr.addColorStop(0.62, "#7F6739");
      gr.addColorStop(1, "#66512C");
      g.fillStyle = gr;
      g.font = lay.font;
      g.textBaseline = "alphabetic";
      for (const q of gl) g.fillText(q.c, q.x, q.y);
    }
    g.globalCompositeOperation = "source-atop";
    // a broad, soft light band across the foil
    const band = g.createLinearGradient(box.w * 0.15, y0, box.w * 0.85, y1);
    band.addColorStop(0, "rgba(255,240,200,0)");
    band.addColorStop(0.45, "rgba(255,240,200,0.12)");
    band.addColorStop(0.55, "rgba(255,240,200,0.12)");
    band.addColorStop(1, "rgba(255,240,200,0)");
    g.fillStyle = band;
    g.fillRect(0, y0, box.w, y1 - y0);
    // fine glitter / foil grain
    const cols = ["rgba(230,212,166,0.6)", "rgba(80,60,24,0.5)", "rgba(196,168,104,0.55)", "rgba(112,88,44,0.55)", "rgba(246,236,206,0.7)"];
    const x0 = box.w * 0.08, xw = box.w * 0.84, n = Math.round(xw * (y1 - y0) * 1.1);
    for (let i = 0; i < n; i++) {
      const z = 0.25 + T() * 0.4;
      g.fillStyle = cols[(T() * cols.length) | 0];
      g.fillRect(x0 + T() * xw, y0 + T() * (y1 - y0), z, z);
    }
    ctx.save();
    // debossed foil: a hairline shadow below, a light catch above
    ctx.fillStyle = "rgba(90,70,40,0.3)";
    drawGlyphs(ctx, lay, 0.18, 0.32);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    drawGlyphs(ctx, lay, -0.15, -0.2);
    ctx.drawImage(oc, 0, y0, oc.width / sc, oc.height / sc);
    ctx.restore();
  }

  /* ------------------------------------------------------------------ */
  /* line-drawn lily (back of the cover, inside sketch)                  */
  /* ------------------------------------------------------------------ */
  function sketchLily(ctx, F, layer, T, style) {
    if (layer !== "art") {
      if (style.foil) paintAnthers(ctx, F, "foil");
      return;
    }
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const lw = style.lw, k = F.M.s / 0.31;
    for (const key of BACK_ORDER.concat(["stamens", "fr"])) {
      if (key === "stamens") {
        // filaments + pistil as fine lines
        ctx.strokeStyle = rgba(style.stem, 0.85);
        ctx.lineWidth = lw * 0.75;
        for (const s of F.stamens) { polyline(ctx, curvePts(s.origin, s.attach, s.bend, 12)); ctx.stroke(); }
        polyline(ctx, curvePts(F.pistil.origin, F.pistil.tip, F.pistil.bend, 12));
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(F.pistil.tip[0], F.pistil.tip[1], 1.6 * k, 0, TAU);
        ctx.stroke();
        if (style.foil) paintAnthers(ctx, F, "art", T, true);
        else {
          for (const s of F.stamens) {
            antherPath(ctx, s);
            ctx.fillStyle = rgba(style.anther, 0.6);
            ctx.fill();
            ctx.strokeStyle = rgba(style.line, 0.8);
            ctx.lineWidth = lw * 0.7;
            ctx.stroke();
          }
        }
        continue;
      }
      const p = F.petals[key], d = p.d;
      // pale wash that also hides the lines behind
      ctx.fillStyle = style.fill;
      ctx.fill(p.path);
      if (style.blush) {
        ctx.save();
        ctx.clip(p.path);
        ctx.lineWidth = 5 * k;
        ctx.strokeStyle = rgba(C.light, style.blush);
        ctx.stroke(p.edge);
        ctx.restore();
      }
      // inner lines: midrib, creases, lip
      ctx.strokeStyle = rgba(style.line, 0.5);
      ctx.lineWidth = lw * 0.6;
      if (!d.under) { along(ctx, p, d.mid || 0, 0.08, 0.5, 12); ctx.stroke(); }
      for (const cr of d.crease || []) { along(ctx, p, cr[0], cr[1], cr[2] * 0.92, 12); ctx.stroke(); }
      if (d.lip) ctx.stroke(smoothPath(new Path2D(), d.lip.slice(1, 6).map(F.M), false));
      // sparse speckles
      if (!d.noSpk && style.spk) {
        for (let i = 0; i < style.spk; i++) {
          const t = 0.08 + Math.pow(T(), 1.3) * 0.62, u = T.range(-0.72, 0.72), q = p.pt(t, u);
          ctx.fillStyle = rgba(T() < 0.5 ? "#E592A8" : "#D97C96", T.range(0.45, 0.85));
          ctx.beginPath();
          ctx.arc(q[0], q[1], style.dot * T.range(0.7, 1.25), 0, TAU);
          ctx.fill();
        }
      }
      // sketchy outline: a firm pass, then a looser second pass
      ctx.strokeStyle = rgba(style.line, style.stipple ? 0.8 : 0.9);
      ctx.lineWidth = style.stipple ? lw * 0.8 : lw;
      ctx.stroke(p.edge);
      const ph = T.range(0, TAU), ph2 = T.range(0, TAU), fq = T.range(5, 9), m = p.edgePts.length;
      const pts = p.edgePts.map((q, i) => [q[0] + style.jit * Math.sin((i / m) * TAU * fq + ph), q[1] + style.jit * Math.cos((i / m) * TAU * (fq - 1.3) + ph2)]);
      ctx.strokeStyle = rgba(style.line, 0.4);
      ctx.lineWidth = lw * 0.6;
      ctx.stroke(smoothPath(new Path2D(), pts, false));
      if (style.stipple) {
        // pigment-pen stipple riding on the line, a touch darker than it
        ctx.fillStyle = rgba(K.mix(style.line, "#5E424C", 0.5), 0.62);
        walk(p.edgePts, style.stipple, (x, y, nx, ny) => {
          if (T() < 0.62) { const j = T.range(-0.7, 0.7) * lw, z = lw * (0.55 + T() * 0.75); ctx.fillRect(x + nx * j - z / 2, y + ny * j - z / 2, z, z); }
        });
      }
    }
  }

  /* ------------------------------------------------------------------ */
  /* the card                                                            */
  /* ------------------------------------------------------------------ */
  K.registerCard({
    id: "mothers-day",
    title: "Mother's Day lily",
    size: { w: 205, h: 300 },
    paper: "#E6E4E0",
    insert: "#FBF8F2",
    ink: "#2B2722",
    foil: "gold",
    message: "For all the\nquiet ways\nyou love us.",
    coverText: "HAPPY\nMOTHER'S DAY",

    drawCover(ctx, box, layer, opts) {
      const scale = opts.scale;
      const M = makeMap(0.3, box.w / 2, 9, false);
      const F = buildFlower(M, opts.rng("layout"));
      F.scale = scale;
      if (layer === "foil") {
        paintAnthers(ctx, F, "foil");
        drawLettering(ctx, box, layer, opts);
        return;
      }
      /* paper */
      const P = opts.rng("paper");
      ctx.fillStyle = PAPER;
      ctx.fillRect(0, 0, box.w, box.h);
      for (let i = 0; i < 12; i++) {
        const x = P() * box.w, y = P() * box.h, r = 25 + P() * 60, light = P() < 0.5;
        const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, light ? "rgba(255,255,255,0.10)" : "rgba(150,140,128,0.04)");
        rg.addColorStop(1, light ? "rgba(255,255,255,0)" : "rgba(150,140,128,0)");
        ctx.fillStyle = rg;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }

      /* the flower is painted on its own sheet so glazes stack and shadows only fall on paint,
         then laid onto the paper with multiply, like transparent watercolour */
      const fc = document.createElement("canvas");
      fc.width = ctx.canvas.width;
      fc.height = ctx.canvas.height;
      const g = fc.getContext("2d");
      g.setTransform(ctx.getTransform());
      const T = opts.rng("wash");
      // the throat itself, so no paper peeks through where the tepals meet
      const tb = M([THROAT[0] + 14, THROAT[1] + 6]);
      g.fillStyle = "#EDEFD3";
      g.beginPath();
      g.ellipse(tb[0], tb[1], 46 * M.s, 30 * M.s, -0.3, 0, TAU);
      g.fill();
      for (const key of BACK_ORDER) paintPetal(g, F.petals[key], T, F);
      // pale green throat
      g.save();
      g.globalCompositeOperation = "source-atop";
      const tr = (24 * M.s) / 0.31;
      const rg = g.createRadialGradient(F.throat[0], F.throat[1], 0, F.throat[0], F.throat[1], tr);
      rg.addColorStop(0, "rgba(222,232,186,0.95)");
      rg.addColorStop(0.45, "rgba(232,236,200,0.55)");
      rg.addColorStop(1, "rgba(240,230,220,0)");
      g.fillStyle = rg;
      g.fillRect(F.throat[0] - tr, F.throat[1] - tr, tr * 2, tr * 2);
      g.restore();
      paintFilaments(g, F);
      paintPetal(g, F.petals.fr, T, F);
      // granulation: pigment settles into the paper tooth
      applyTooth(g, scale, 1, "source-atop");
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = "multiply";
      ctx.drawImage(fc, 0, 0);
      ctx.restore();

      paintAnthers(ctx, F, "art", opts.rng("pollen"));
      drawLettering(ctx, box, layer, opts);
      applyTooth(ctx, scale, 1);
      // a whisper of edge darkening so the card reads as a sheet
      const v = ctx.createRadialGradient(box.w / 2, box.h * 0.45, box.h * 0.35, box.w / 2, box.h * 0.45, box.h * 0.78);
      v.addColorStop(0, "rgba(90,80,70,0)");
      v.addColorStop(1, "rgba(90,80,70,0.05)");
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, box.w, box.h);
    },

    drawBack(ctx, box, layer, opts) {
      const M = makeMap(0.262, box.w / 2, 40, true);
      const F = buildFlower(M, opts.rng("layout"));
      F.scale = opts.scale;
      const style = { lw: 0.75, line: C.sketch, stem: "#BFA08E", fill: "rgba(250,245,245,0.8)", blush: 0.25, spk: 40, dot: 0.48, jit: 0.4, stipple: 0.5, foil: true, anther: "#C9A04A" };
      sketchLily(ctx, F, layer, layer === "art" ? opts.rng("sketch") : null, style);
    },

    drawInside(ctx, box, layer, opts) {
      if (layer !== "art") return;
      const s = 36 / (BBOX.y1 - BBOX.y0);
      const M = makeMap(s, box.w / 2, box.h * 0.8 - 18, false);
      const F = buildFlower(M, opts.rng("layout"));
      F.scale = opts.scale;
      const style = { lw: 0.5, line: "#A2878F", stem: "#B39C9C", fill: "rgba(251,248,242,0.95)", blush: 0.18, spk: 4, dot: 0.22, jit: 0.2, stipple: 0, foil: false, anther: "#D8B7A0" };
      sketchLily(ctx, F, layer, opts.rng("sketch"), style);
    },
  });
