<title>Taste Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane review desk. Library + breakdown | live specimen + filmstrip scrubber | discussion + annotations */
:root{
  --bg:#F4F4F2; --panel:#FFFFFF; --panel-2:#F0F0ED; --line:#E4E3DF; --fg:#19191B; --muted:#6F6E73; --faint:#A8A7AB;
  --pill:#19191B; --pill-fg:#FFFFFF; --mark:#E0457B; --mark-soft:rgba(224,69,123,.14);
  --ok:#1F8A5B; --warn:#A86A12; --bad:#C23B3B; --bezel:#111113; --stage:#ECECE9;
  --shadow:0 1px 2px rgba(20,20,22,.05),0 10px 30px rgba(20,20,22,.07);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --panel:#18181B; --panel-2:#222226; --line:#2C2C31; --fg:#EDEDEF; --muted:#9C9BA3; --faint:#64636B;
  --pill:#EDEDEF; --pill-fg:#141416; --mark:#F06B98; --mark-soft:rgba(240,107,152,.18);
  --ok:#4CC38A; --warn:#E2A23B; --bad:#F07171; --bezel:#000000; --stage:#141417;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --panel:#18181B; --panel-2:#222226; --line:#2C2C31; --fg:#EDEDEF; --muted:#9C9BA3; --faint:#64636B;
  --pill:#EDEDEF; --pill-fg:#141416; --mark:#F06B98; --mark-soft:rgba(240,107,152,.18);
  --ok:#4CC38A; --warn:#E2A23B; --bad:#F07171; --bezel:#000000; --stage:#141417;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
[contenteditable]{outline:none;border-radius:4px;transition:background .15s}
[contenteditable]:hover{background:var(--panel-2)}
[contenteditable]:focus{background:var(--panel-2);box-shadow:0 0 0 1px var(--line)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:276px minmax(0,1fr) 304px;grid-template-rows:minmax(0,1fr) auto;height:100%}
.side,.right{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.side{border-right:1px solid var(--line);overflow:auto}
.right{border-left:1px solid var(--line)}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:500;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.btn.dark:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.on{background:var(--mark-soft);border-color:var(--mark);color:var(--mark)}
.btn svg{width:14px;height:14px;flex:none}
.icon-btn{width:28px;padding:0;justify-content:center}
.badge{font:600 9.5px/1 var(--font);letter-spacing:.06em;padding:3px 5px;border-radius:4px;background:var(--panel-2);color:var(--muted)}

/* sidebar */
.team{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
.ava{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#FF7AA8,#B5124F 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.team b{display:block;font-weight:600}
.team small{color:var(--muted);font-size:11.5px}
.team .btn{margin-left:auto}
.block{margin:0 10px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.block-h{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border:0;background:none;text-align:left;border-radius:var(--r)}
.block-h:hover{background:var(--panel-2)}
.block-h b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-h small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.block-h small{color:var(--muted);font-size:11.5px}
.block-h .grow{flex:1;min-width:0}
.block-h .chev{transition:transform .2s;color:var(--faint)}
.block.closed .chev{transform:rotate(-90deg)}
.block.closed .block-b{display:none}
.block-b{padding:0 10px 12px}
.ico{width:26px;height:26px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.ico svg{width:14px;height:14px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:9px;background:var(--panel-2)}
.seg button{border:0;background:none;height:26px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:3px}

.pane{padding-top:12px;display:flex;flex-direction:column;gap:12px}
.pane .lede{color:var(--muted);font-size:12px}
.summary{font-size:12.5px;line-height:1.55;padding:2px 4px;margin:0 -4px}
.obs{position:relative;display:flex;flex-direction:column;gap:3px}
.obs h4{margin:0 -4px;padding:1px 4px;font-size:12.5px;font-weight:600}
.obs p{margin:0 -4px;padding:1px 4px;color:var(--muted);font-size:12px;line-height:1.5}
.del{position:absolute;right:-4px;top:-2px;width:22px;height:22px;border:0;border-radius:6px;background:var(--panel);color:var(--faint);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.obs:hover .del,.tl-row:hover .del,.ann:hover .del,.cmt:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--bad);background:var(--panel-2)}
.add{border:1px dashed var(--line);background:none;border-radius:8px;height:30px;color:var(--muted);font-size:12px}
.add:hover{border-color:var(--faint);color:var(--fg)}
.prompt{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:10px;font-size:12px;line-height:1.55}
.row{display:flex;gap:6px;flex-wrap:wrap}

.tl{display:flex;flex-direction:column}
.tl-row{position:relative;display:grid;grid-template-columns:12px 46px minmax(0,1fr);gap:6px;align-items:start;padding:7px 4px;margin:0 -4px;border-radius:7px}
.tl-row .dot{width:5px;height:5px;border-radius:50%;background:var(--faint);margin-top:7px;justify-self:center;transition:transform .2s,background .2s}
.tl-row .tt{border:0;background:none;padding:2px 0;text-align:left;font:500 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tl-row .tt:hover{color:var(--fg);text-decoration:underline}
.tl-row .tx{font-size:12px;color:var(--muted);padding:1px 4px;margin:0 -4px;line-height:1.45}
.tl-row.active{background:var(--panel-2)}
.tl-row.active .dot{background:var(--fg);transform:scale(1.5)}
.tl-row.active .tx,.tl-row.active .tt{color:var(--fg)}

.pal{display:flex;flex-direction:column;gap:2px}
.sw{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 4px;margin:0 -4px;border-radius:7px}
.sw:hover{background:var(--panel-2)}
.chip{position:relative;width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);overflow:hidden}
.chip input{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer}
.sw .nm{font-weight:500;font-size:12px;padding:0 3px;margin:0 -3px}
.sw .rl{font-size:11px;color:var(--muted);padding:0 3px;margin:0 -3px}
.sw .hx{font:11px var(--mono);color:var(--muted);text-align:right}
.cr{font:600 9.5px var(--mono);padding:2px 4px;border-radius:4px;margin-top:2px;display:inline-block}
.cr{color:var(--muted);background:var(--panel-2)}
.cr.aaa,.cr.aa{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.cr.lg{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.cr.fail{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.mini{display:flex;margin-left:auto}
.mini i{width:12px;height:12px;border-radius:50%;margin-left:-3px;box-shadow:0 0 0 1.5px var(--panel)}

.meta{margin:4px 16px 12px;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12px}
.meta dt{color:var(--muted);display:flex;align-items:center;gap:7px}
.meta dt svg{width:13px;height:13px;color:var(--faint)}
.meta dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.meta select{border:0;background:none;text-align:right;font-size:12px;cursor:pointer}
.tags{display:inline-flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.tag{font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--panel-2);color:var(--muted)}

.explore{padding:6px 16px 16px;border-top:1px solid var(--line);flex:1}
.explore h3{font-size:12.5px;margin:12px 0 8px;font-weight:600}
.chips{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.chips button{height:24px;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:none;font-size:11.5px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--pill);color:var(--pill-fg);border-color:var(--pill)}
.lib{display:flex;flex-direction:column;gap:4px}
.lib-item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px;margin:0 -5px;border-radius:9px;border:0;background:none;text-align:left}
.lib-item:hover{background:var(--panel-2)}
.lib-item[aria-current="true"]{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.lib-item .th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--panel-2);display:block}
.lib-item b{font-weight:500;font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item small{font-size:11px;color:var(--muted)}
.lib-item .kind{font:500 9.5px var(--mono);color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.dropzone{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:14px 10px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--mark);background:var(--mark-soft);color:var(--fg)}
.dropzone b{color:var(--fg);font-weight:500}

/* center */
.center-h{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}
.center-h h1{font-size:14px;font-weight:600;margin:0;padding:2px 6px;margin-left:-6px;min-width:40px}
.center-h .sp{flex:1}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:8px 16px;overflow:hidden}
.device{position:relative;padding:7px;border-radius:44px;background:var(--bezel);box-shadow:0 30px 60px -20px rgba(20,20,22,.35),0 0 0 1px rgba(255,255,255,.06) inset;transition:border-radius .3s,padding .3s}
.device.still{padding:0;border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.screen{position:relative;border-radius:37px;overflow:hidden;background:#fff;touch-action:manipulation}
.device.still .screen{border-radius:12px}
.screen canvas,.screen img{display:block;width:100%;height:100%}
.screen img{object-fit:contain;background:var(--panel)}
.screen.annotating{cursor:crosshair}
.screen.annotating::after{content:"Click anywhere to drop a note";position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--pill);color:var(--pill-fg);font-size:11.5px;padding:6px 10px;border-radius:99px;white-space:nowrap;pointer-events:none;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%,6px)}}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50% 50% 50% 4px;background:var(--mark);color:#fff;font:600 11px/22px var(--font);text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25);transform:scale(0) rotate(-20deg);transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .2s;opacity:0;pointer-events:auto;cursor:pointer;border:0;padding:0}
.pin.on{transform:scale(1) rotate(0);opacity:1}
.pin .tip{position:absolute;left:28px;top:-2px;width:max-content;max-width:190px;background:var(--pill);color:var(--pill-fg);font:400 11.5px/1.4 var(--font);text-align:left;padding:6px 9px;border-radius:8px;opacity:0;transform:translateX(-4px);transition:.18s;pointer-events:none}
.pin:hover .tip,.pin.flash .tip{opacity:1;transform:none}
.drop-veil{position:absolute;inset:10px;border:2px dashed var(--mark);border-radius:16px;background:var(--mark-soft);display:grid;place-items:center;font-weight:600;color:var(--mark);pointer-events:none;opacity:0;transition:opacity .15s}
.dragging .drop-veil{opacity:1}

.scrub{margin:0 16px 12px;padding:8px 10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.scrub-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.time{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.time span{color:var(--faint)}
.mode{font:500 10.5px var(--mono);padding:2px 7px;border-radius:99px;background:var(--panel-2);color:var(--muted);letter-spacing:.02em}
.mode.live{background:var(--mark-soft);color:var(--mark)}
.scrub-top .sp{flex:1}
.strip{position:relative;height:74px;cursor:ew-resize;touch-action:none;user-select:none}
.strip canvas{display:block;width:100%;height:100%;border-radius:6px}
.marks{position:absolute;inset:0;pointer-events:none}
.mk{box-sizing:border-box;display:grid;place-items:center;line-height:1;position:absolute;top:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--panel);border:2px solid var(--fg);pointer-events:auto;cursor:pointer;padding:0;transition:transform .15s}
.mk:hover{transform:scale(1.35)}
.mk.ann{border-color:var(--mark);background:var(--mark);width:15px;height:15px;margin-left:-7.5px;top:-8px;color:#fff;font:600 8.5px/1 var(--font)}
.playhead{position:absolute;top:-3px;bottom:12px;width:2px;margin-left:-1px;background:var(--fg);pointer-events:none;border-radius:2px}
.playhead::before{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--fg)}
.scrub-hint{font-size:11px;color:var(--faint);text-align:center;margin-top:3px}
.scrub.no-motion .strip,.scrub.no-motion .play,.scrub.no-motion .time,.scrub.no-motion .speed,.scrub.no-motion .mode{display:none}

/* right */
.right-h{padding:12px 12px 8px}
.rpane{flex:1;overflow:auto;padding:4px 16px 12px;min-height:0}
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:48px 8px;color:var(--muted);font-size:12px}
.empty .bub{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--faint)}
.empty b{color:var(--fg);font-weight:500}
.sec-label{font-size:11px;color:var(--faint);margin:6px 0 10px;letter-spacing:.02em}
.cmt{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:8px 0;animation:rise2 .3s ease-out}
@keyframes rise2{from{opacity:0;transform:translateY(6px)}}
.cmt .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;color:#fff;background:var(--fg)}
.cmt .who{font-size:12px;font-weight:600}
.cmt .who span{font-weight:400;color:var(--faint);margin-left:4px;font-size:11px}
.cmt p{margin:2px 0 0;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.ann{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;padding:9px 6px;margin:0 -6px;border-radius:9px;animation:rise2 .3s ease-out}
.ann:hover{background:var(--panel-2)}
.ann .num{width:22px;height:22px;border-radius:50% 50% 50% 4px;background:var(--mark);color:#fff;font:600 11px/22px var(--font);text-align:center;border:0;padding:0}
.ann .at{font:500 11px var(--mono);color:var(--muted);border:0;background:none;padding:0}
.ann .at:hover{color:var(--fg);text-decoration:underline}
.ann textarea{width:100%;border:0;background:none;resize:none;font-size:12.5px;line-height:1.45;padding:2px 4px;margin:2px -4px 0;border-radius:4px;field-sizing:content;min-height:22px}
.ann textarea:focus{background:var(--panel);box-shadow:0 0 0 1px var(--line);outline:none}
.compose{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.compose .av{width:24px;height:24px;border-radius:50%;background:var(--fg);flex:none}
.compose input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:99px;background:var(--panel-2);padding:0 12px;font-size:12.5px}
.compose input:focus{outline:none;border-color:var(--faint)}

/* bar */
.bar .sp{flex:1}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;margin-right:8px}
.brand i{width:16px;height:16px;border-radius:5px;background:conic-gradient(from 200deg,#F5A524,#F06BA8,#7FB7FF,#9BE15D,#F5A524)}
.save-state{font-size:11.5px;color:var(--faint)}

/* modal + toast */
.veil{position:fixed;inset:0;background:rgba(10,10,12,.42);display:grid;place-items:center;padding:16px;z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;animation:pop .25s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h2{margin:0;font-size:15px;text-wrap:balance}
.modal p{margin:0;color:var(--muted);font-size:12.5px;max-width:62ch}
.modal textarea{width:100%;height:240px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font:11.5px/1.5 var(--mono);padding:10px;resize:vertical}
.toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,20px);background:var(--pill);color:var(--pill-fg);padding:8px 14px;border-radius:99px;font-size:12.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .app{grid-template-columns:260px minmax(0,1fr)}
  .right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}
  body{overflow:auto} .app{height:auto;min-height:100%}
  .center{min-height:760px}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .center{order:-1;min-height:700px}
  .side{border-right:0;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" aria-label="Reference details">
    <div class="team">
      <div class="ava" aria-hidden="true"></div>
      <div><b>Team Taste</b><small>@teamtaste</small></div>
      <button class="btn" id="followBtn" type="button">Following</button>
    </div>

    <section class="block" id="bdBlock">
      <button class="block-h" type="button" data-toggle="bdBlock" aria-expanded="true">
        <span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h10M3 8h7M3 12h9"/></svg></span>
        <span class="grow"><b>Design breakdown</b><small>Learn to describe design</small></span>
        <span class="badge">PRO</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4.5l3 3 3-3"/></svg>
      </button>
      <div class="block-b">
        <div class="seg" role="tablist" id="bdTabs">
          <button role="tab" type="button" data-tab="breakdown" aria-selected="true">Breakdown</button>
          <button role="tab" type="button" data-tab="prompt" aria-selected="false">Prompt</button>

<script>
(()=>{
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const E={inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out:t=>1-Math.pow(1-t,3),
  back:t=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  spring:t=>t>=1?1:1-Math.exp(-7*t)*Math.cos(9*t)};
const hex2rgb=h=>{h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]};
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('').toUpperCase();
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)};
const rgba=(h,a)=>{const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${a})`};
const lum=h=>{const c=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const grade=r=>r>=7?['AAA','aaa']:r>=4.5?['AA','aa']:r>=3?['AA large','lg']:['Fail','fail'];
const fmt=t=>t.toFixed(2)+'s';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- the specimen: a scripted avatar-store screen drawn on canvas ---------- */
const W=280,H=580,DUR=11;
const CATS=[{k:'face',n:'Face'},{k:'top',n:'Tops'},{k:'bottom',n:'Bottoms'},{k:'scarf',n:'Scarves'},{k:'shoes',n:'Shoes'},{k:'hat',n:'Hats'},{k:'acc',n:'Accessories'}];
const ITEMS={
  face:[{c:'#1C1B1F',k:'round'},{c:'#E3E1DB',k:'square'},{c:'#F06BA8',k:'heart'},{c:'#3A7BD5',k:'round'},{c:'#C9A227',k:'square'},{c:null}],
  top:[{c:'#2F8F83'},{c:'#1C1B1F',s:'#FFFFFF'},{c:'#F27BA6'},{c:'#FFFFFF',s:'#36B3A8'},{c:'#E9E6DF'},{c:'#3B3355',s:'#F27BA6'}],
  bottom:[{c:'#6B2E4F'},{c:'#2C3E66'},{c:'#D9C9A3'},{c:'#1C1B1F'},{c:'#7FA36B'},{c:'#E86A5C'}],
  scarf:[{c:'#F27BA6'},{c:'#F4C430'},{c:'#4C9F70'},{c:'#FFFFFF',s:'#E5484D'},{c:'#3A7BD5'},{c:'#8E5BD0'}],
  shoes:[{c:'#E8457A'},{c:'#FFFFFF'},{c:'#1C1B1F'},{c:'#F4A62A'},{c:'#3A7BD5'},{c:'#7FA36B'}],
  hat:[{c:null},{c:'#E5484D'},{c:'#2C3E66'},{c:'#F4C430'},{c:'#FFFFFF',s:'#36B3A8'},{c:'#1C1B1F'}],
  acc:[{c:'#F06BA8'},{c:'#9BE15D'},{c:'#F8B4A6'},{c:'#7FB7FF'},{c:'#FFD166'},{c:'#C39BFF'}]
};
const PRICES=[120,80,250,60,180,95];
const OUTFIT0={face:5,top:0,bottom:0,scarf:0,shoes:0,hat:0,acc:-1};
const SCRIPT=[{t:.6,tab:1},{t:1.3,item:2},{t:2,tab:2},{t:2.6,item:1},{t:3.3,tab:3},{t:3.9,item:1},{t:4.6,tab:4},{t:5.2,item:1},
  {t:5.9,tab:6},{t:6.5,item:0},{t:7.2,tab:0},{t:7.8,item:0},{t:8.5,tab:5},{t:9.1,item:3},{t:9.9,tab:1},{t:10.5,item:5}];
const tabC=i=>({x:20+i*40,y:334});
const itemR=j=>({x:16+(j%3)*86,y:386+Math.floor(j/3)*86,w:76,h:76});
const itemC=j=>{const r=itemR(j);return{x:r.x+r.w/2,y:r.y+r.h/2}};
const evPos=e=>e.tab!=null?tabC(e.tab):itemC(e.item);
const REST={x:214,y:520};

function stateAt(t){
  let tab=6,prev=6,tabAt=-9,outfit={...OUTFIT0},equip=null,tap=null;
  for(const e of SCRIPT){if(e.t>t)break;
    if(e.tab!=null){prev=tab;tab=e.tab;tabAt=e.t}else{outfit[CATS[tab].k]=e.item;equip={cat:CATS[tab].k,at:e.t}}
    tap={t:e.t,p:evPos(e)}}
  // finger path: glide between taps on an arc
  let i=-1;while(i+1<SCRIPT.length&&SCRIPT[i+1].t<=t)i++;
  const a=i>=0?SCRIPT[i]:null,b=SCRIPT[i+1];
  const p0=a?evPos(a):REST,p1=b?evPos(b):REST,t0=a?a.t:0,t1=b?b.t:DUR;
  const s=E.inOut(clamp((t-(t0+.16))/Math.max(.05,(t1-.08)-(t0+.16)),0,1));
  const cursor={x:p0.x+(p1.x-p0.x)*s,y:p0.y+(p1.y-p0.y)*s-Math.sin(Math.PI*s)*22,
    down:b?clamp(1-(t1-t)/.1,0,1):0,alpha:clamp(Math.min(t/.3,(DUR-t)/.3),0,1)};
  return{clock:t,tab,prev,tabAt,outfit,equip,tap,cursor,look:cursor};
}

function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function poly(c,cx,cy,s,pts){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(cx+x*s,cy+y*s):c.moveTo(cx+x*s,cy+y*s));c.closePath()}
function stripes(c,cx,cy,s,col){if(!col)return;c.save();c.clip();c.fillStyle=col;for(let y=-.5;y<.5;y+=.16)c.fillRect(cx-s,cy+y*s,s*2,s*.07);c.restore()}
const LINE='rgba(0,0,0,.12)';
/* item glyphs, reused for cards, tab icons and the character's wardrobe */
const GLYPH={
  top(c,x,y,s,it){poly(c,x,y,s,[[-.2,-.36],[-.5,-.18],[-.38,.04],[-.29,-.02],[-.29,.4],[.29,.4],[.29,-.02],[.38,.04],[.5,-.18],[.2,-.36],[.1,-.28],[0,-.25],[-.1,-.28]]);
    c.fillStyle=it.c;c.fill();c.strokeStyle=LINE;c.lineWidth=1;c.stroke();if(it.s){poly(c,x,y,s,[[-.29,-.1],[.29,-.1],[.29,.4],[-.29,.4]]);stripes(c,x,y,s,it.s)}},
  bottom(c,x,y,s,it){poly(c,x,y,s,[[-.28,-.38],[.28,-.38],[.33,.4],[.06,.4],[0,-.06],[-.06,.4],[-.33,.4]]);c.fillStyle=it.c;c.fill();c.strokeStyle=LINE;c.stroke();
    c.fillStyle='rgba(0,0,0,.12)';c.fillRect(x-.28*s,y-.38*s,.56*s,.08*s)},
  scarf(c,x,y,s,it){c.fillStyle=it.c;c.strokeStyle=LINE;c.lineWidth=1;c.beginPath();c.ellipse(x,y-.14*s,.34*s,.14*s,0,0,7);c.fill();c.stroke();
    c.beginPath();c.ellipse(x,y-.14*s,.2*s,.05*s,0,0,7);c.fillStyle='rgba(0,0,0,.18)';c.fill();c.fillStyle=it.c;
    for(const[a,dx]of[[.22,.02],[-.12,.16]]){c.save();c.translate(x+dx*s,y-.06*s);c.rotate(a);rr(c,-.07*s,0,.14*s,.46*s,.05*s);c.fill();c.stroke();
      if(it.s){rr(c,-.07*s,0,.14*s,.46*s,.05*s);stripes(c,0,.2*s,s,it.s)}c.restore()}},
  shoes(c,x,y,s,it){c.beginPath();c.moveTo(x-.38*s,y+.14*s);c.lineTo(x-.38*s,y-.18*s);c.quadraticCurveTo(x-.3*s,y-.26*s,x-.14*s,y-.2*s);
    c.quadraticCurveTo(x+.02*s,y-.02*s,x+.3*s,y+.0*s);c.quadraticCurveTo(x+.42*s,y+.04*s,x+.4*s,y+.14*s);c.closePath();c.fillStyle=it.c;c.fill();c.strokeStyle=LINE;c.stroke();
    c.fillStyle='#FFFFFF';rr(c,x-.4*s,y+.12*s,.82*s,.08*s,.04*s);c.fill();c.strokeStyle=LINE;c.stroke()},
  hat(c,x,y,s,it){if(!it.c)return GLYPH.none(c,x,y,s);c.beginPath();c.ellipse(x,y+.1*s,.34*s,.36*s,0,Math.PI,0);c.fillStyle=it.c;c.fill();c.strokeStyle=LINE;c.stroke();
    if(it.s){c.beginPath();c.ellipse(x,y+.1*s,.34*s,.36*s,0,Math.PI,0);stripes(c,x,y,s,it.s)}
    c.fillStyle=mix(it.c,'#000000',.15);rr(c,x-.38*s,y+.06*s,.76*s,.13*s,.06*s);c.fill();c.beginPath();c.arc(x,y-.3*s,.08*s,0,7);c.fillStyle=it.s||mix(it.c,'#FFFFFF',.3);c.fill()},
  face(c,x,y,s,it){if(!it.c)return GLYPH.none(c,x,y,s);glasses(c,x,y,s*.9,it)},
  acc(c,x,y,s,it){flower(c,x,y,s*.5,it.c)},
  none(c,x,y,s){c.strokeStyle='rgba(0,0,0,.28)';c.lineWidth=1.6;c.beginPath();c.arc(x,y,.22*s,0,7);c.moveTo(x-.15*s,y+.15*s);c.lineTo(x+.15*s,y-.15*s);c.stroke()}
};
function glasses(c,x,y,s,it){c.strokeStyle=it.c;c.lineWidth=Math.max(1.5,s*.06);const dx=.22*s,r=.15*s;
  for(const sx of[-1,1]){c.beginPath();if(it.k==='square')rr(c,x+sx*dx-r,y-r*.85,r*2,r*1.7,r*.35);else if(it.k==='heart'){heart(c,x+sx*dx,y,r*1.1)}else c.arc(x+sx*dx,y,r,0,7);
    c.fillStyle=rgba(it.c,.16);c.fill();c.stroke()}
  c.beginPath();c.moveTo(x-dx+r,y-r*.2);c.quadraticCurveTo(x,y-r*.6,x+dx-r,y-r*.2);c.stroke()}
function heart(c,x,y,r){c.moveTo(x,y+r*.9);c.bezierCurveTo(x-r*1.6,y-r*.1,x-r*.6,y-r*1.3,x,y-r*.4);c.bezierCurveTo(x+r*.6,y-r*1.3,x+r*1.6,y-r*.1,x,y+r*.9);c.closePath()}
function flower(c,x,y,s,col,rot=0){for(let i=0;i<5;i++){const a=rot+i*Math.PI*2/5;c.beginPath();c.arc(x+Math.cos(a)*s*.42,y+Math.sin(a)*s*.42,s*.34,0,7);c.fillStyle=col;c.fill()}
  c.beginPath();c.arc(x,y,s*.24,0,7);c.fillStyle=mix(col,'#FFFFFF',.55);c.fill()}

function drawCharacter(c,cx,feetY,v,P){
  const t=v.clock,o=v.outfit,it=k=>ITEMS[k][o[k]];
  let sx=1,sy=1;const e=v.equip?t-v.equip.at:9;
  if(e>=0&&e<.55){const k=Math.sin(e/.55*Math.PI)*(1-e/.55);sy=1-.09*k;sx=1+.06*k}
  const bob=Math.sin(t*2.4)*2.2*(e<.55?.3:1);
  c.save();c.translate(cx,feetY+bob*.2);c.scale(sx,sy);c.translate(0,-112+bob);
  // shoes + legs
  const sh=it('shoes'),bt=it('bottom');
  for(const s of[-1,1]){c.beginPath();c.ellipse(s*13,106,13,6.5,0,0,7);c.fillStyle=sh.c;c.fill();c.strokeStyle=LINE;c.stroke();
    c.fillStyle='#FFFFFF';c.fillRect(s*13-12,108,24,3)}
  c.fillStyle=bt.c;rr(c,-21,56,42,48,8);c.fill();c.fillStyle='rgba(0,0,0,.14)';c.fillRect(-.6,68,1.2,36);c.fillRect(-21,56,42,4);
  // arms
  const sw=Math.sin(t*2.4+1)*.06;
  for(const s of[-1,1]){c.save();c.translate(s*27,14);c.rotate(s*(.18+sw));c.fillStyle=P.skin;rr(c,-6,0,12,40,6);c.fill();c.restore()}
  // torso
  const tp=it('top');c.fillStyle=tp.c;rr(c,-29,6,58,56,15);c.fill();c.strokeStyle=LINE;c.stroke();
  if(tp.s){rr(c,-29,6,58,56,15);c.save();c.clip();c.fillStyle=tp.s;for(let y=14;y<64;y+=9)c.fillRect(-30,y,60,4);c.restore()}
  for(const s of[-1,1]){c.save();c.translate(s*27,14);c.rotate(s*(.18+sw));c.fillStyle=tp.c;rr(c,-8,-4,16,18,7);c.fill();c.restore()}
  // head petals
  const petal=mix(P.skin,P.accent,.42);
  for(let i=0;i<9;i++){const a=Math.PI+i*Math.PI/8+Math.sin(t*3+i)*.05,r=39;
    c.beginPath();c.arc(Math.cos(a)*r,-48+Math.sin(a)*r*.95,13+(i%2)*2,0,7);c.fillStyle=i%2?petal:mix(petal,P.skin,.35);c.fill()}
  // head
  const g=c.createRadialGradient(-12,-62,4,0,-48,40);g.addColorStop(0,mix(P.skin,'#FFFFFF',.28));g.addColorStop(1,P.skin);
  c.beginPath();c.arc(0,-48,37,0,7);c.fillStyle=g;c.fill();
  // scarf
  const sc=it('scarf');c.fillStyle=sc.c;rr(c,-24,-8,48,15,7.5);c.fill();rr(c,7,0,11,24,5);c.fill();
  if(sc.s){rr(c,-24,-8,48,15,7.5);c.save();c.clip();c.fillStyle=sc.s;for(let x=-24;x<24;x+=8)c.fillRect(x,-8,3.5,15);c.restore()}
  // face
  const lx=v.look?clamp((v.look.x-cx)/45,-3,3):0,ly=v.look?clamp((v.look.y-(feetY-160))/60,-2.5,3):0;
  const ph=(t+.7)%3.4,bl=ph<.16?Math.max(.08,Math.abs(Math.cos(ph/.16*Math.PI))):1;
  for(const s of[-1,1]){c.save();c.translate(s*14,-50);c.scale(1,bl);c.beginPath();c.ellipse(0,0,10,11,0,0,7);c.fillStyle='#FFFFFF';c.fill();
    c.beginPath();c.arc(lx,ly,5.6,0,7);c.fillStyle=P.ink;c.fill();c.beginPath();c.arc(lx+1.8,ly-2,1.8,0,7);c.fillStyle='#FFFFFF';c.fill();c.restore()}
  c.fillStyle=rgba(P.accent,.38);for(const s of[-1,1]){c.beginPath();c.ellipse(s*25,-35,6,3.5,0,0,7);c.fill()}
  c.beginPath();c.arc(0,-34,4.5,.15*Math.PI,.85*Math.PI);c.strokeStyle=P.ink;c.lineWidth=2;c.lineCap='round';c.stroke();
  const fc=it('face');if(fc.c)glasses(c,0,-50,64,fc);
  const ht=it('hat');if(ht.c){c.save();c.translate(0,-84);GLYPH.hat(c,0,0,78,ht);c.restore()}
  if(o.acc>=0)flower(c,-30,-82,20,ITEMS.acc[o.acc].c,t*.6);
  c.restore();
  // sparkle burst on equip
  if(e>=0&&e<.6){const q=e/.6;for(let i=0;i<8;i++){const a=i/8*Math.PI*2+.3,r=40+q*55;c.beginPath();
    c.arc(cx+Math.cos(a)*r,feetY-120+Math.sin(a)*r*.8,3*(1-q)+.5,0,7);c.fillStyle=rgba(i%2?P.accent:P.glow,1-q);c.fill()}}
}

function drawScene(c,v,P,opt={}){
  const t=v.clock;
  c.fillStyle='#FFFFFF';c.fillRect(0,0,W,H);

  if(tab==='discussion'){p.innerHTML=`<div class="sec-label">Public discussion</div>`+(ref.comments.length?ref.comments.map(c=>`<div class="cmt" data-id="${c.id}"><span class="av">Y</span>

    `<div class="empty"><span class="bub"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 12.5V4.5A1.5 1.5 0 014.5 3h7A1.5 1.5 0 0113 4.5v5A1.5 1.5 0 0111.5 11H5.5z"/></svg></span><b>No comments yet</b>What stands out to you?</div>`)}
  else{p.innerHTML=`<div class="sec-label">Notes pinned to the specimen${ref.kind==='demo'?' at a moment in time':''}</div>`+(ref.annotations.length?ref.annotations.map((a,i)=>`<div class="ann" data-id="${a.id}">
    <button class="num" type="button" data-seek="${a.t}" data-ann="${a.id}" aria-label="Go to note ${i+1}">${i+1}</button><div style="min-width:0">${ref.kind==='demo'?`<button class="at" type="button" data-seek="${a.t}" data-ann="${a.id}">${fmt(a.t)}</button>`:''}
    <textarea rows="1" data-ann-text="${a.id}" placeholder="What do you notice here?" aria-label="Note ${i+1}">${esc(a.text)}</textarea></div>
    <button class="del" type="button" data-del-ann="${a.id}" aria-label="Delete note">×</button></div>`).join(''):
    `<div class="empty"><span class="bub">+</span><b>No notes yet</b>Press Annotate, then click the specimen.</div>`)}}

/* ---------- top-level render ---------- */
function renderAll(){const ref=cur();
  $('#title').textContent=ref.title;
  const demo=ref.kind==='demo';device.classList.toggle('still',!demo);phone.hidden=!demo;still.hidden=demo;
  if(!demo){still.src=ref.img;still.onload=fit}
  $('#scrub').classList.toggle('no-motion',!demo);
  $('#hint').textContent=demo?'Tap the phone to take over · Space plays · ← → step · A annotates':'Stills have no playback. Press Annotate and click the image to pin a note.';
  if(!demo)exitLive();
  renderBd();renderPal();renderMeta();renderLib();renderRight();renderMarks();renderPins();fit();syncTransport()}

/* ---------- transport ---------- */
const PLAY='<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l7.5-4.5z"/></svg>',PAUSE='<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="3.5" width="3" height="9" rx=".8"/><rect x="9" y="3.5" width="3" height="9" rx=".8"/></svg>';
function syncTransport(){$('#playBtn').innerHTML=playing?PAUSE:PLAY;$('#playBtn').setAttribute('aria-label',playing?'Pause':'Play');
  const m=$('#mode');m.textContent=live?'INTERACTIVE':'SCRIPTED';m.classList.toggle('live',!!live);$('#annBtn').classList.toggle('on',annotating);screen.classList.toggle('annotating',annotating)}
function seek(t,pause=true){exitLive();T=clamp(t,0,DUR-.001);if(pause)playing=false;syncTransport()}
let lastTl=null;
function updateTimelineUI(){$('#time').innerHTML=`${live?'live':fmt(T)} <span>/ ${fmt(DUR)}</span>`;
  $('#playhead').style.left=(T/DUR*100)+'%';const at=$('#addTlT');if(at)at.textContent=fmt(T);
  const rows=$$('#bdPane .tl-row');if(!rows.length)return;let act=null;for(const r of rows)if(+r.dataset.t<=T+1e-6)act=r;
  if(act!==lastTl){rows.forEach(r=>r.classList.toggle('active',r===act));lastTl=act}}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const ref=cur();
  if(ref.kind==='demo'){if(playing&&!live){T+=dt*speed;if(T>=DUR)T-=DUR}
    const v=live?liveView():stateAt(T);pctx.setTransform(phone.width/W,0,0,phone.height/H,0,0);drawScene(pctx,v,palOf(ref),{cursor:!live});
    updateTimelineUI();pinVis()}
  requestAnimationFrame(frame)}

/* ---------- events ---------- */
const toastEl=$('#toast');let toastT;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1800)}
async function copy(text,label){try{await navigator.clipboard.writeText(text);toast(label||'Copied')}catch(e){openModal('Copy this',"Your browser blocked the clipboard. Select the text below and copy it.",text);}}

document.addEventListener('click',e=>{const el=e.target.closest('button,[data-seek]');if(!el)return;const ref=cur();
  if(el.dataset.toggle){const b=$('#'+el.dataset.toggle);b.classList.toggle('closed');el.setAttribute('aria-expanded',!b.classList.contains('closed'));return}
  if(el.dataset.tab){S.ui.bdTab=el.dataset.tab;renderBd();save();return}
  if(el.dataset.r){S.ui.rTab=el.dataset.r;renderRight();save();return}
  if(el.dataset.f&&el.closest('#chips')){S.ui.filter=el.dataset.f;renderLib();save();return}
  if(el.classList.contains('lib-item')){S.activeId=el.dataset.id;T=0;playing=!reduced&&cur().kind==='demo';annotating=false;renderAll();save();return}
  if(el.dataset.seek!=null){if(ref.kind==='demo')seek(+el.dataset.seek);if(el.dataset.ann){const pin=$(`.pin[data-ann="${el.dataset.ann}"]`);if(pin){pinVis(true);pin.classList.add('flash');setTimeout(()=>pin.classList.remove('flash'),1600)}}return}
  if(el.dataset.delSec){ref.sections=ref.sections.filter(s=>s.id!==el.dataset.delSec);renderBd();save();return}
  if(el.dataset.delTl){ref.timeline=ref.timeline.filter(s=>s.id!==el.dataset.delTl);renderBd();renderMarks();save();return}
  if(el.dataset.delAnn){ref.annotations=ref.annotations.filter(s=>s.id!==el.dataset.delAnn);renderRight();renderMarks();renderPins();save();return}
  if(el.dataset.delCmt){ref.comments=ref.comments.filter(s=>s.id!==el.dataset.delCmt);renderRight();save();return}
  switch(el.id){
    case'addSec':{const s={id:uid(),h:'New observation',b:'Describe what you like and why it works.'};ref.sections.push(s);renderBd();save();
      const h=$(`.obs[data-id="${s.id}"] h4`);h.focus();getSelection().selectAllChildren(h);break}
    case'addTl':{const n={id:uid(),t:+T.toFixed(2),text:'What happens here?'};ref.timeline.push(n);renderBd();renderMarks();save();
      const x=$(`.tl-row[data-id="${n.id}"] .tx`);x.focus();getSelection().selectAllChildren(x);break}
    case'copyPrompt2':case'copyPromptBtn':copy(ref.prompt,'Prompt copied');break;
    case'rebuild':ref.prompt=buildPrompt(ref);renderBd();save();toast('Prompt rebuilt from your breakdown');break;
    case'playBtn':if(live)exitLive();playing=!playing;if(playing&&T>=DUR-.01)T=0;syncTransport();break;
    case'speedBtn':speed=speed===1?.5:speed===.5?.25:1;el.textContent=speed===1?'1×':speed+'×';break;
    case'annBtn':annotating=!annotating;syncTransport();break;
    case'saveBtn':save(true);toast('Saved to your library');break;
    case'dupBtn':{const c=JSON.parse(JSON.stringify(ref));c.id=uid();c.title=ref.title+' copy';c.added=new Date().toISOString().slice(0,10);S.refs.splice(S.refs.indexOf(ref)+1,0,c);S.activeId=c.id;renderAll();save();toast('Duplicated. Edit away.');break}
    case'followBtn':el.textContent=el.textContent==='Following'?'Follow':'Following';break;
    case'mcpBtn':openModal('Use your taste with an AI assistant','This is your taste profile for every reference in the library: palettes with roles, written observations, timelines and notes. Paste it into Claude Code, Cursor or Codex (or save it as taste-profile.json in your repo) and ask the assistant to follow it when building UI.',JSON.stringify(profile(),null,2),true);break;
    case'importBtn':openImport();break;
    case'resetBtn':openConfirm();break;
  }});

// inline edits
document.addEventListener('input',e=>{const t=e.target,ref=cur();
  if(t.id==='title'){ref.title=t.textContent.trim()||'Untitled';const li=$(`.lib-item[data-id="${ref.id}"] b`);if(li)li.textContent=ref.title}
  else if(t.dataset.f==='summary')ref.summary=t.textContent;
  else if(t.closest('.obs')){const s=ref.sections.find(x=>x.id===t.closest('.obs').dataset.id);if(s)s[t.dataset.f]=t.textContent}
  else if(t.id==='promptIn')ref.prompt=t.value;
  else if(t.classList.contains('tx')){const s=ref.timeline.find(x=>x.id===t.closest('.tl-row').dataset.id);if(s){s.text=t.textContent;renderMarks()}}
  else if(t.dataset.annText){const a=ref.annotations.find(x=>x.id===t.dataset.annText);if(a){a.text=t.value;const tip=$(`.pin[data-ann="${a.id}"] .tip`);if(tip)tip.textContent=a.text||'Empty note'}}
  else if(t.type==='color'){const p=ref.palette[+t.dataset.i];p.hex=t.value.toUpperCase();t.parentElement.style.background=p.hex;
    const hx=t.closest('.sw').querySelector('.hx');if(hx)hx.firstChild.textContent=p.hex;clearTimeout(filmT);filmT=setTimeout(()=>{renderFilm();renderPal()},160)}
  else if(t.dataset.pf){const p=ref.palette[+t.closest('.sw').dataset.i];p[t.dataset.pf]=t.textContent}
  else if(t.id==='platform'){ref.platform=t.value;renderLib()}
  else return;save()});
let filmT;
document.addEventListener('change',e=>{if(e.target.id==='platform'){cur().platform=e.target.value;renderLib();save()}});
$('#title').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}});

// comments
$('#compose').addEventListener('submit',e=>{e.preventDefault();const v=$('#cmtIn').value.trim();if(!v)return;cur().comments.push({id:uid(),text:v,at:Date.now()});$('#cmtIn').value='';renderRight();save();
  const p=$('#rPane');p.scrollTop=p.scrollHeight});

// phone: tap to interact or annotate
screen.addEventListener('click',e=>{if(e.target.closest('.pin'))return;const ref=cur(),r=screen.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  if(annotating){const a={id:uid(),t:ref.kind==='demo'?+T.toFixed(2):0,x:clamp(x,.04,.96),y:clamp(y,.04,.96),text:''};
    if(ref.kind==='demo'){exitLive();playing=false}ref.annotations.push(a);annotating=false;S.ui.rTab='annotations';
    renderRight();renderMarks();renderPins();syncTransport();save();setTimeout(()=>$(`[data-ann-text="${a.id}"]`)?.focus(),30);return}
  if(ref.kind==='demo')phoneTap(toLogical(e))});
phone.addEventListener('pointermove',e=>{if(live)pointer=toLogical(e)});
phone.addEventListener('pointerleave',()=>pointer=null);

// scrubbing
const strip=$('#strip');let scrubbing=false;
function scrubTo(e){const r=strip.getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width,0,1)*DUR)}
strip.addEventListener('pointerdown',e=>{if(e.target.closest('.mk'))return;scrubbing=true;strip.setPointerCapture(e.pointerId);scrubTo(e)});
strip.addEventListener('pointermove',e=>{if(scrubbing)scrubTo(e)});
strip.addEventListener('pointerup',()=>scrubbing=false);

// keyboard
document.addEventListener('keydown',e=>{const tg=e.target;if(tg.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(tg.tagName))return;if(cur().kind!=='demo'&&e.key!=='a')return;
  if(e.key===' '){e.preventDefault();$('#playBtn').click()}
  else if(e.key==='ArrowRight'){seek(T+(e.shiftKey?1:.1))}else if(e.key==='ArrowLeft'){seek(T-(e.shiftKey?1:.1))}
  else if(e.key==='a'||e.key==='A'){annotating=!annotating;syncTransport()}
  else if(e.key==='Escape'){annotating=false;syncTransport()}});

/* ---------- adding stills: drop, paste, pick ---------- */
const fileIn=$('#fileIn');
fileIn.addEventListener('change',()=>{[...fileIn.files].forEach(addFile);fileIn.value=''});
let dragDepth=0;
addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){dragDepth++;document.body.classList.add('dragging')}});
addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)document.body.classList.remove('dragging')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('dragging');[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')).forEach(addFile)});
addEventListener('paste',e=>{const tg=e.target;if(tg.isContentEditable||/INPUT|TEXTAREA/.test(tg.tagName))return;[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/')).forEach(addFile)});

function addFile(file){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
  const m=1100,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.84);
  const title=(file.name||'Pasted screenshot').replace(/\.[a-z0-9]+$/i,'').replace(/[-_]+/g,' ');
  const ref=analyzeRef(c,title,data);S.refs.push(ref);S.activeId=ref.id;S.ui.bdTab='breakdown';annotating=false;renderAll();save();toast('Added and broken down on this device')};img.src=fr.result};fr.readAsDataURL(file)}

/* on-device breakdown: palette quantization, WCAG contrast, edge density, temperature */
function colorName(h){const[r,g,b]=hex2rgb(h).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,s=d?d/(1-Math.abs(2*l-1)):0;
  let hue=0;if(d){hue=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;hue=(hue*60+360)%360}
  if(l<.14)return'Ink';if(l>.93)return'Snow';if(s<.12)return l>.6?'Mist':l>.35?'Stone':'Slate';
  const n=[[15,'Red'],[35,'Coral'],[50,'Amber'],[68,'Butter'],[95,'Lime'],[150,'Green'],[175,'Mint'],[195,'Teal'],[225,'Sky'],[255,'Indigo'],[285,'Violet'],[320,'Plum'],[345,'Rose'],[360,'Red']].find(([m])=>hue<=m)[1];
  return(l>.78?'Pale ':l<.3?'Deep ':'')+n}
function analyzeRef(src,title,data){const n=72,c=document.createElement('canvas');c.width=n;c.height=n;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,n,n);
  const d=x.getImageData(0,0,n,n).data,B=new Map(),L=new Float32Array(n*n);let warm=0,cool=0,satSum=0;
  for(let p=0;p<n*n;p++){const r=d[p*4],g=d[p*4+1],b=d[p*4+2],k=(r>>4)<<8|(g>>4)<<4|(b>>4);const e=B.get(k)||{r:0,g:0,b:0,n:0};e.r+=r;e.g+=g;e.b+=b;e.n++;B.set(k,e);
    L[p]=(.2126*r+.7152*g+.0722*b)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0;satSum+=s;if(s>.25){if(r>b)warm+=s;else cool+=s}}
  let edges=0;for(let y=0;y<n-1;y++)for(let xx=0;xx<n-1;xx++){const p=y*n+xx;if(Math.abs(L[p]-L[p+1])+Math.abs(L[p]-L[p+n])>.12)edges++}
  const density=edges/((n-1)*(n-1));
  const cols=[...B.values()].map(e=>({hex:rgb2hex(e.r/e.n,e.g/e.n,e.b/e.n),share:e.n/(n*n)})).sort((a,b)=>b.share-a.share);
  const pick=[];for(const cl of cols){const A=hex2rgb(cl.hex);const near=pick.find(q=>{const Q=hex2rgb(q.hex);return Math.hypot(A[0]-Q[0],A[1]-Q[1],A[2]-Q[2])<52});
    if(near)near.share+=cl.share;else if(pick.length<6)pick.push({...cl})}
  const bg=pick[0],rest=pick.slice(1);const text=rest.slice().sort((a,b)=>contrast(b.hex,bg.hex)-contrast(a.hex,bg.hex))[0]||bg;
  const satOf=h=>{const[r,g,b]=hex2rgb(h);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx?(mx-mn)/mx:0};
  const accent=rest.filter(c=>c!==text).sort((a,b)=>satOf(b.hex)*Math.sqrt(b.share)-satOf(a.hex)*Math.sqrt(a.share))[0]||text;
  const role=c=>c===bg?'Background':c===text?'Text':c===accent?'Accent':lum(c.hex)>lum(bg.hex)?'Raised surface':'Support';
  const palette=pick.map(c=>({key:uid(),name:colorName(c.hex),role:role(c),hex:c.hex,share:c.share}));
  const light=lum(bg.hex)>.4,temp=warm>cool*1.2?'warm':cool>warm*1.2?'cool':'neutral',dens=density<.09?'airy':density<.2?'balanced':'dense';
  const cr=contrast(text.hex,bg.hex),g=grade(cr),pct=v=>Math.round(v*100)+'%';
  const verdict=cr>=4.5?'passes WCAG AA for body text':cr>=3?'passes only for large text (18px+ or 14px bold)':'fails WCAG AA, so it needs a darker text color';
  const ref={id:uid(),kind:'image',title,img:data,platform:'Web',added:new Date().toISOString().slice(0,10),tags:['Still'],palette,
    summary:`On-device breakdown of ${title}: a ${light?'light':'dark'}, ${temp} interface with a ${dens} layout. These notes come from pixel measurements, so rewrite them to say what you actually like.`,
    sections:[
      {id:uid(),h:'Ground',b:`${colorName(bg.hex)} ${bg.hex} covers about ${pct(bg.share)} of the frame, so the screen reads as ${light?'light':'dark'} first.`},
      {id:uid(),h:'Text contrast',b:`${text.hex} on ${bg.hex} measures ${cr.toFixed(1)}:1 (${g[0]}). It ${verdict}.`},
      {id:uid(),h:'Accent',b:`${colorName(accent.hex)} ${accent.hex} is the most saturated color and covers about ${pct(accent.share)} of the frame. Keep it for primary actions and selection.`},
      {id:uid(),h:'Density',b:`Edge density is ${pct(density)}, so the layout feels ${dens}. ${dens==='airy'?'Generous whitespace does most of the grouping.':dens==='dense'?'Many small elements compete, and grouping relies on borders and color.':'Spacing and borders share the grouping work.'}`},
      {id:uid(),h:'Temperature',b:`Average saturation is ${pct(satSum/(n*n))}, and the saturated pixels lean ${temp}.`}],
    timeline:[],annotations:[],comments:[]};
  ref.prompt=buildPrompt(ref);return ref}
function buildPrompt(ref){return`Design an interface in the style of "${ref.title}". ${ref.summary.replace(/These notes come from.*$/,'').trim()}\n\n`+
  ref.sections.map(s=>`${s.h}: ${s.b}`).join('\n')+`\n\nPalette:\n`+ref.palette.map(p=>`- ${p.name} ${p.hex}: ${p.role}`).join('\n')+
  (ref.timeline?.length?`\n\nMotion beats:\n`+ref.timeline.slice().sort((a,b)=>a.t-b.t).map(e=>`- ${fmt(e.t)} ${e.text}`).join('\n'):'')+
  (ref.annotations?.length?`\n\nNotes:\n`+ref.annotations.filter(a=>a.text).map(a=>`- ${a.text}`).join('\n'):'')}
function profile(){return{generator:'Taste Studio',exported:new Date().toISOString(),references:S.refs.map(r=>({title:r.title,kind:r.kind==='demo'?'motion':'still',platform:r.platform,
  summary:r.summary,observations:r.sections.map(s=>({title:s.h,detail:s.b})),palette:r.palette.map(p=>({name:p.name,role:p.role,hex:p.hex})),
  timeline:(r.timeline||[]).map(e=>({at:+e.t.toFixed(2),note:e.text})),notes:r.annotations.filter(a=>a.text).map(a=>a.text),prompt:r.prompt}))}}

/* ---------- modals ---------- */
function closeModal(){$('.veil')?.remove()}
function openModal(title,body,text,copyable){closeModal();const v=document.createElement('div');v.className='veil';
  v.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><p>${esc(body)}</p><textarea readonly id="modalText" spellcheck="false">${esc(text)}</textarea>
  <div class="row" style="justify-content:flex-end">${copyable?'<button class="btn dark" type="button" id="mCopy">Copy profile</button>':''}<button class="btn" type="button" id="mClose">Close</button></div></div>`;
  document.body.append(v);v.addEventListener('click',e=>{if(e.target===v||e.target.id==='mClose')closeModal();if(e.target.id==='mCopy')copy(text,'Taste profile copied')});
  if(!copyable){const ta=$('#modalText');ta.focus();ta.select()}}
function openImport(){closeModal();const v=document.createElement('div');v.className='veil';
  v.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Import"><h2>Import a library</h2><p>Paste a Taste Studio library (the JSON from a teammate's copy). It replaces this browser's library.</p>
  <textarea id="impText" spellcheck="false" placeholder='{"activeId": …, "refs": [ … ]}'></textarea><p id="impErr" style="color:var(--bad)"></p>
  <div class="row" style="justify-content:space-between"><button class="btn ghost" type="button" id="impCopy">Copy my library JSON</button><span class="row"><button class="btn" type="button" id="mClose">Cancel</button><button class="btn dark" type="button" id="impGo">Import</button></span></div></div>`;
  document.body.append(v);v.addEventListener('click',e=>{if(e.target===v||e.target.id==='mClose')closeModal();
    if(e.target.id==='impCopy')copy(JSON.stringify({activeId:S.activeId,refs:S.refs}),'Library JSON copied');
    if(e.target.id==='impGo'){try{const d=JSON.parse($('#impText').value);if(!Array.isArray(d.refs)||!d.refs.length)throw 0;S={...d,ui:S.ui};if(!cur())S.activeId=S.refs[0].id;closeModal();renderAll();save();toast('Library imported')}
      catch(err){$('#impErr').textContent='That is not a Taste Studio library. It needs a "refs" list with at least one reference.'}}})}
function openConfirm(){closeModal();const v=document.createElement('div');v.className='veil';
  v.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Reset"><h2>Reset the Tolan Store demo?</h2><p>This restores the demo's original breakdown, palette, timeline and notes. Your added stills stay in the library.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="mClose">Cancel</button><button class="btn dark" type="button" id="rsGo">Reset demo</button></div></div>`;
  document.body.append(v);v.addEventListener('click',e=>{if(e.target===v||e.target.id==='mClose')closeModal();
    if(e.target.id==='rsGo'){const i=S.refs.findIndex(r=>r.id==='tolan'),d=demoRef();if(i>=0)S.refs[i]=d;else S.refs.unshift(d);S.activeId='tolan';T=0;closeModal();renderAll();save();toast('Demo restored')}})}
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- boot ---------- */
renderAll();
document.fonts?.ready.then(()=>{renderFilm()});
requestAnimationFrame(frame);
})();
</script>
